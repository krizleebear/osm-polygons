          PBF_URL: 'https://download.geofabrik.de/europe/ukraine-latest.osm.pbf'
          COUNTRY_CODE: 'UA'

  #Short list of entries I wasn't 100% sure about and why:
  #
  #canary-islands — COUNTRY_CODE: "ES-CN" is non‑standard. Canary Islands belong to Spain (ES); remove “-CN” or use ES only.
  #senegal-and-gambia — set to "SN" but the region contains both Senegal (SN) and The Gambia (GM). Decide SN, GM, or both.
  #haiti-and-domrep — set to "HT" but includes Dominican Republic (DO) as well. Decide HT, DO, or split.
  #ireland-and-northern-ireland — set to "IE" but includes Northern Ireland (part of GB/UK). Decide IE, GB, or split.
  #gcc-states — set to "AE" but this is a multi‑country region (AE, SA, KW, OM, QA, BH). Needs a regional token or per‑country split.
  #malaysia-singapore-brunei — set to "MY" but covers MY, SG, BN. Decide one or list multiple.
  #israel-and-palestine — set to "IL" but could include PS (Palestine) as well; clarify desired code(s).
  #kosovo — "XK" is a common user‑assigned code (not official ISO); confirm if acceptable.
  #swaziland — "SZ" is correct code but country renamed to Eswatini (no code change); just noting.

    steps:

    - task: DownloadPipelineArtifact@2
      enabled: true
      inputs:
        buildType: 'specific'
        project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
        definition: '3'
        buildVersionToDownload: 'latest'
        itemPattern: 'osm-data-$(OSM_REGION)/$(OSM_REGION).osm.pbf'
        targetPath: '$(System.DefaultWorkingDirectory)'

    - task: Bash@3
      enabled: true
      displayName: 'filter and export polygons'
      inputs:
        targetType: 'inline'
        script: |
          set -x
          ls -la
          pwd
          osmium --version

          INPUT_PBF=osm-data-$(OSM_REGION)/$(OSM_REGION).osm.pbf
          if [ ! -f "$INPUT_PBF" ]; then
            echo "****************************************************************"
            echo " ERROR: Missing PBF file for region '$(OSM_REGION)'!"
            echo ""
            echo " File '$INPUT_PBF' was not found."
            echo ""
            echo " Cause:"
            echo " The PBF download pipeline has not been executed for '$(OSM_REGION)' yet."
            echo ""
            echo " Solution:"
            echo " Please run the PBF download pipeline ('osm-download') in Azure DevOps"
            echo " first to generate the required PBF dataset for '$(OSM_REGION)'."
            echo "****************************************************************"
            exit 1
          fi
          ADMIN_PBF=$(OSM_REGION).admins.pbf
          POLYGON_JSON=$(COUNTRY_CODE)_$(OSM_REGION).admin-polygons.geojsonseq

          # Step 1: Filter administrative boundaries
          osmium tags-filter --output ${ADMIN_PBF} --overwrite ${INPUT_PBF} boundary=administrative

          # Reclaim disk space: Remove heavy raw input PBF immediately after filtering
          rm -rf osm-data-$(OSM_REGION)

          # Ensure python3 is available in container
          which python3 || (apt-get update -qq && apt-get install -y -qq python3)

          # Step 2: Stream export directly to stdout and filter/enhance with filter_polygons.py
          # Purpose of filter_polygons.py:
          # 1. Enforce admin_level=2 for key national mainland relations (FR 2202162, GB 62149, NO 2978650, PT 295438).
          # 2. Prevent tag loss: fallback missing/null 'name' tags to name:en, official_name, ISO3166-1, or ref.
          # 3. Flag territorial sea boundaries (border_type=territorial, maritime=yes) to prioritize landmasses.
          # 4. Map fallback admin_level_mapped="4" for countries lacking native admin_level=4 relations (EE, HR, ME, SI, XK, etc.).
          if [ "${{ parameters.requireWikidata }}" = "true" ]; then
            osmium export ${ADMIN_PBF} --output-format=geojsonseq --overwrite --config=osmium-export-config.json \
              | python3 scripts/filter_polygons.py --require-wikidata --country-code $(COUNTRY_CODE) > ${POLYGON_JSON}
          else
            osmium export ${ADMIN_PBF} --output-format=geojsonseq --overwrite --config=osmium-export-config.json \
              | python3 scripts/filter_polygons.py --country-code $(COUNTRY_CODE) > ${POLYGON_JSON}
          fi

          # Reclaim disk space: Remove intermediate admin PBF immediately
          rm -f ${ADMIN_PBF}

    - task: PublishPipelineArtifact@1
      enabled: true
      displayName: 'Store polygon artifacts'
      inputs:
        targetPath: '$(COUNTRY_CODE)_$(OSM_REGION).admin-polygons.geojsonseq'
        artifact: 'admin-polygons-$(COUNTRY_CODE)-$(OSM_REGION)'
        publishLocation: 'pipeline'

    - task: Bash@3
      displayName: 'Cleanup workspace'
      condition: always()
      inputs:
        targetType: 'inline'
        script: |
          rm -rf $(System.DefaultWorkingDirectory)/*

- stage: simplify
  displayName: 'Simplify polygons by continent'
  dependsOn: export
  condition: always()

  jobs:
  - job: simplify
    timeoutInMinutes: 360
    workspace:
      clean: all
    container: osm-tools
    strategy:
      matrix:
        africa:
          CONTINENT: 'africa'
          REGIONS: 'algeria angola benin botswana burkina-faso burundi cameroon canary-islands cape-verde central-african-republic chad comores congo-brazzaville congo-democratic-republic djibouti egypt equatorial-guinea eritrea ethiopia gabon ghana guinea guinea-bissau ivory-coast kenya lesotho liberia libya madagascar malawi mali mauritania mauritius morocco mozambique namibia niger nigeria rwanda saint-helena-ascension-and-tristan-da-cunha sao-tome-and-principe senegal-and-gambia seychelles sierra-leone somalia south-africa south-sudan sudan swaziland tanzania togo tunisia uganda zambia zimbabwe'
        asia:
          CONTINENT: 'asia'
          REGIONS: 'afghanistan armenia azerbaijan bangladesh bhutan cambodia china gcc-states india indonesia iran iraq israel-and-palestine japan jordan kazakhstan kyrgyzstan laos lebanon malaysia-singapore-brunei maldives mongolia myanmar nepal north-korea pakistan philippines south-korea sri-lanka syria taiwan tajikistan thailand turkmenistan uzbekistan vietnam yemen'
        australia_oceania:
          CONTINENT: 'australia-oceania'
          REGIONS: 'australia fiji new-caledonia new-zealand papua-new-guinea'
        central_america:
          CONTINENT: 'central-america'
          REGIONS: 'bahamas belize cuba guatemala haiti-and-domrep jamaica nicaragua'
        north_america:
          CONTINENT: 'north-america'
          REGIONS: 'greenland mexico'
        canada:
          CONTINENT: 'canada'
          REGIONS: 'canada'
        us:
          CONTINENT: 'us'
          REGIONS: 'us'
        south_america:
          CONTINENT: 'south-america'
          REGIONS: 'argentina bolivia brazil chile colombia ecuador guyana paraguay peru suriname uruguay venezuela'

        europe:
          CONTINENT: 'europe'
          REGIONS: 'albania andorra austria azores belarus belgium bosnia-herzegovina bulgaria croatia cyprus czech-republic denmark estonia faroe-islands finland france georgia germany great-britain greece hungary iceland ireland-and-northern-ireland isle-of-man italy kosovo latvia liechtenstein lithuania luxembourg macedonia malta moldova monaco montenegro netherlands norway poland portugal romania serbia slovakia slovenia spain sweden switzerland turkey ukraine'
        russia:
          CONTINENT: 'russia'
          REGIONS: 'russia'

    steps:
    - checkout: none #skip checking out the default repository resource
    ${{ if eq(parameters.reuseExportArtifacts, true) }}:
      - task: DownloadPipelineArtifact@2
        enabled: true
        displayName: 'Download export artifacts from latest build'
        inputs:
          buildType: 'specific'
          project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
          definition: '4'
          buildVersionToDownload: 'latest'
          allowFailedBuilds: true
          allowPartiallySucceededBuilds: true
          itemPattern: 'admin-polygons-*/**'
          targetPath: '$(System.DefaultWorkingDirectory)'
    ${{ if eq(parameters.reuseExportArtifacts, false) }}:
      - task: DownloadPipelineArtifact@2
        enabled: true
        displayName: 'Download export artifacts from current build'
        inputs:
          buildType: 'current'
          itemPattern: 'admin-polygons-*/**'
          targetPath: '$(System.DefaultWorkingDirectory)'


    - task: Bash@3
      enabled: true
      displayName: 'simplify polygons'
      inputs:
        workingDirectory: '$(System.DefaultWorkingDirectory)'
        targetType: 'inline'
        script: |
          set -x
          export JAVA_TOOL_OPTIONS="-Xmx6g"
          mkdir -p simplified


          for region in $(REGIONS); do
            find . -type f \( -name "*_${region}.admin-polygons.geojsonseq" -o -name "${region}.admin-polygons.geojsonseq" \) | while read -r file; do
              if [ ! -s "$file" ]; then
                echo "WARNING: File $file is empty (0 bytes). Skipping simplification."
                rm -f "$file"
                continue
              fi
              echo "Simplifying $file ($(wc -l < "$file") features)..."
              /simplify.sh "$file"
              SIMPLIFIED_OUTPUT=$(find $(dirname "$file") -name "*.simplified.geojsonseq" | head -n 1)
              if [ -n "$SIMPLIFIED_OUTPUT" ] && [ -f "$SIMPLIFIED_OUTPUT" ]; then
                mv "$SIMPLIFIED_OUTPUT" "simplified/$(basename "$file")"
              fi
              rm -f "$file"
            done
          done



          # Save osm-tools container git version info
          unzip -p /app/app.jar git.properties > simplified/osm-tools-version.info 2>/dev/null || true

          ls -laR simplified/

          SIMPLIFIED_COUNT=$(find simplified -name "*.geojsonseq" | wc -l)
          if [ "$SIMPLIFIED_COUNT" -eq 0 ]; then
            echo "****************************************************************"
            echo " ERROR: No simplified polygon files were produced for continent '$(CONTINENT)'!"
            echo ""
            echo " Cause:"
            echo " Upstream export artifacts for regions in '$(CONTINENT)' were missing"
            echo " or contained 0 features."
            echo ""
            echo " Solution:"
            echo " Check upstream 'export' stage logs to verify .geojsonseq artifacts"
            echo " were generated and downloaded correctly."
            echo "****************************************************************"
            exit 1
          fi

          tar cfz simplified-$(CONTINENT).tar.gz simplified/



    - task: PublishPipelineArtifact@1
      enabled: true
      displayName: 'Store simplified continent artifact'
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/simplified-$(CONTINENT).tar.gz'
        artifact: 'admin-polygons-simplified-$(CONTINENT)'
        publishLocation: 'pipeline'

    - task: Bash@3
      displayName: 'Cleanup workspace'
      condition: always()
      inputs:
        targetType: 'inline'
        script: |
          rm -rf $(System.DefaultWorkingDirectory)/*

- stage: package
  displayName: 'Package global simplified polygons'
  dependsOn: simplify
  condition: always()

  jobs:
  - job: package
    timeoutInMinutes: 360
    workspace:
      clean: all
    pool:

      vmImage: 'ubuntu-latest'
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      enabled: true
      displayName: 'Download all simplified continent artifacts'
      inputs:
        buildType: 'current'
        buildVersionToDownload: 'latest'
        itemPattern: 'admin-polygons-simplified-*/**'
        targetPath: '$(System.DefaultWorkingDirectory)/archives'
    - task: Bash@3
      enabled: true
      displayName: 'Bundle global artifact'
      inputs:
        targetType: 'inline'
        script: |
          set -x
          mkdir -p simplified
          find archives -name "simplified-*.tar.gz" | while read -r archive; do
            tar xfz "$archive" -C .
          done

          SIMPLIFIED_COUNT=$(find simplified -name "*.geojsonseq" | wc -l)
          if [ "$SIMPLIFIED_COUNT" -eq 0 ]; then
            echo "****************************************************************"
            echo " ERROR: No simplified polygon files were extracted from continent archives!"
            echo ""
            echo " Cause:"
            echo " The 'simplify' stage produced empty continent archives."
            echo ""
            echo " Solution:"
            echo " Verify that the 'simplify' stage completed successfully and generated"
            echo " valid .geojsonseq files before running the 'package' stage."
            echo "****************************************************************"
            exit 1
          fi

          OSM_TOOLS_COMMIT=$(grep "git.commit.id.full" simplified/osm-tools-version.info 2>/dev/null | cut -d'=' -f2 || echo "latest")
          OSM_TOOLS_BUILD_TIME=$(grep "git.build.time" simplified/osm-tools-version.info 2>/dev/null | cut -d'=' -f2 || echo "")

          cat <<EOF > simplified/build-info.json
          {
            "osm_data_extracted_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "osmium_tool_image": "v1.18.0",
            "osm_tools_commit": "${OSM_TOOLS_COMMIT}",
            "osm_tools_build_time": "${OSM_TOOLS_BUILD_TIME}",
            "pipeline_commit": "$(Build.SourceVersion)",
            "pipeline_build_number": "$(Build.BuildNumber)"
          }
          EOF



          ls -la simplified/
          tar cfz simplified.tar.gz simplified/

    - task: PublishPipelineArtifact@1
      enabled: true
      displayName: 'Store global simplified artifact'
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/simplified.tar.gz'
        artifact: 'admin-polygons-simplified'
        publishLocation: 'pipeline'

    - task: Bash@3
      displayName: 'Cleanup workspace'
      condition: always()
      inputs:
        targetType: 'inline'
        script: |
          rm -rf $(System.DefaultWorkingDirectory)/*
