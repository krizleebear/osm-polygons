  #Short list of entries I wasn't 100% sure about and why:
  #
  #canary-islands — COUNTRY_CODE: "ES-CN" is non‑standard. Canary Islands belong to Spain (ES); remove “-CN” or use ES only.
  #senegal-and-gambia — set to "SN" but the region contains both Senegal (SN) and The Gambia (GM). Decide SN, GM, or both.
  #haiti-and-domrep — set to "HT" but includes Dominican Republic (DO) as well. Decide HT, DO, or split.
  #ireland-and-northern-ireland — set to "IE" but includes Northern Ireland (part of GB/UK). Decide IE, GB, or split.
  #gcc-states — set to "AE" but this is a multi‑country region (AE, SA, KW, OM, QA, BH). Needs a regional token or per‑country split.
  #malaysia-singapore-brunei — set to "MY" but covers MY, SG, BN. Decide one or list multiple.
  #israel-and-palestine — set to "IL" but could include PS (Palestine) as well; clarify desired code(s).
  #kosovo — "XK" is a common user‑assigned code (not official ISO); confirm if acceptable.
  #swaziland — "SZ" is correct code but country renamed to Eswatini (no code change); just noting.

    steps:

    - task: DownloadPipelineArtifact@2
      enabled: true
      inputs:
        buildType: 'specific'
        project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
        definition: '3'
        buildVersionToDownload: 'latest'
        itemPattern: 'osm-data-$(OSM_REGION)/$(OSM_REGION).osm.pbf'
        targetPath: '$(System.DefaultWorkingDirectory)'

    - task: Bash@3
      enabled: true
      displayName: 'filter and export polygons'
      inputs:
        targetType: 'inline'
        script: |
          set -x
          ls -la
          pwd
          osmium --version

          INPUT_PBF=osm-data-$(OSM_REGION)/$(OSM_REGION).osm.pbf
          if [ ! -f "$INPUT_PBF" ]; then
            echo "****************************************************************"
            echo " ERROR: Missing PBF file for region '$(OSM_REGION)'!"
            echo ""
            echo " File '$INPUT_PBF' was not found."
            echo ""
            echo " Cause:"
            echo " The PBF download pipeline has not been executed for '$(OSM_REGION)' yet."
            echo ""
            echo " Solution:"
            echo " Please run the PBF download pipeline ('osm-download') in Azure DevOps"
            echo " first to generate the required PBF dataset for '$(OSM_REGION)'."
            echo "****************************************************************"
            exit 1
          fi
          ADMIN_PBF=$(OSM_REGION).admins.pbf
          POLYGON_JSON=$(COUNTRY_CODE)_$(OSM_REGION).admin-polygons.geojsonseq

          # Step 1: Filter administrative boundaries (broad osmium filter, expressions OR-combined;
          # precise sub-municipal refinement happens in filter_polygons.py per SPEC_OSM_POLYGONS_SUBDIVISIONS.md):
          # - Rule 1: boundary=administrative (admin_level 2..11)
          # - Rule 2: boundary=local_authority/borough
          # - Rule 3: relations with place=suburb/quarter/borough/neighbourhood (type=boundary/multipolygon checked in Python)
          osmium tags-filter --output ${ADMIN_PBF} --overwrite ${INPUT_PBF} \
            boundary=administrative \
            boundary=local_authority,borough \
            r/place=suburb,quarter,borough,neighbourhood

          # Reclaim disk space: Remove heavy raw input PBF immediately after filtering
          rm -rf osm-data-$(OSM_REGION)

          # Step 2: Stream export directly to stdout and filter/enhance with filter_polygons.py
          # Purpose of filter_polygons.py:
          # 1. Enforce admin_level=2 for key national mainland relations (FR 11980/2202162, NL 47796/2323309, GB 62149, NO 2978650, PT 295438).
          # 2. Exclude non-administrative & political boundaries (boundary IN ('political', 'statistical', 'census', 'historic'), political=*, election=*).
          # 3. Exclude non-relation border sliver ways (@type=way) tagged admin_level=2 lacking official ISO3166-1 tags.
          # 4. Prevent tag loss: fallback missing/null 'name' tags to name:en, official_name, ISO3166-1, or ref.
          # 5. Flag territorial sea boundaries (border_type=territorial, maritime=yes) to prioritize landmasses.
          # 6. Map fallback admin_level_mapped="4" for countries lacking native admin_level=4 relations (EE, HR, ME, SI, XK, etc.).
          # 8. Enrich administrative boundary relations with official admin_centre and label member coordinates
          #    (center_lat, center_lon, admin_centre:lat, admin_centre:lon, label:lat, label:lon) per SPEC_ADMINISTRATIVE_CENTERS.md.
          if [ "${{ parameters.requireWikidata }}" = "true" ]; then
            osmium export ${ADMIN_PBF} --output-format=geojsonseq --overwrite --config=osmium-export-config.json \
              | python3 scripts/filter_polygons.py --require-wikidata --country-code $(COUNTRY_CODE) --admin-pbf ${ADMIN_PBF} > ${POLYGON_JSON}
          else
            osmium export ${ADMIN_PBF} --output-format=geojsonseq --overwrite --config=osmium-export-config.json \
              | python3 scripts/filter_polygons.py --country-code $(COUNTRY_CODE) --admin-pbf ${ADMIN_PBF} > ${POLYGON_JSON}
          fi

          # Reclaim disk space: Remove intermediate admin PBF immediately
          rm -f ${ADMIN_PBF}

    - task: PublishPipelineArtifact@1
      enabled: true
      displayName: 'Store polygon artifacts'
      inputs:
        targetPath: '$(COUNTRY_CODE)_$(OSM_REGION).admin-polygons.geojsonseq'
        artifact: 'admin-polygons-$(COUNTRY_CODE)-$(OSM_REGION)'
        publishLocation: 'pipeline'

    - task: Bash@3
      displayName: 'Cleanup workspace'
      condition: always()
      inputs:
        targetType: 'inline'
        script: |
          rm -rf $(System.DefaultWorkingDirectory)/*

  - job: tag_export
    displayName: 'Tag build with export artifacts & save metadata'
    dependsOn: export
    condition: succeeded()
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: none
    - bash: |
        set -e
        mkdir -p export_meta
        cat <<EOF > export_meta/export-info.json
        {
          "exported_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
          "export_pipeline_commit": "$(Build.SourceVersion)",
          "export_build_number": "$(Build.BuildNumber)",
          "export_build_id": "$(Build.BuildId)",
          "osmium_tool_image": "v1.19.0"
        }
        EOF
        echo "##vso[build.addbuildtag]has-export-artifacts"
      displayName: 'Record export metadata and add build tag'
    - task: PublishPipelineArtifact@1
      displayName: 'Store export metadata artifact'
      inputs:
        targetPath: 'export_meta'
        artifact: 'admin-polygons-export-metadata'
        publishLocation: 'pipeline'


