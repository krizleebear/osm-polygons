# OSM polygon export pipeline
# Exports polygons of localities to geoJSON streams.
name: polygon-pipeline

resources:
  containers:
  - container: osmium-tool
    # Use mirror.gcr.io to prevent Docker Hub pull rate limits during multi-job matrix execution
    image: mirror.gcr.io/krizleebear/docker-osmium-tool:v1.19.1
    #image: krizleebear/docker-osmium-tool:v1.19.1
    #endpoint: docker-krizleebear
  - container: osm2parquet
    # DuckDB spatial converter for unsimplified GeoParquet 1.1 exports;
    # v1.0.6+ also ships python3 (stdlib) + duckdb httpfs/spatial for Overture fallback (fetch_overture_polygons.py)
    image: ghcr.io/krizleebear/osm2parquet:v1.0.6

trigger:
- none

pool:
  vmImage: 'ubuntu-latest'

parameters:
- name: reuseExportArtifacts
  displayName: 'Reuse existing exported .geojsonseq artifacts (Skip slow PBF filter stage)'
  type: boolean
  default: false
- name: exportBuildId
  displayName: 'Specific Build ID to reuse export artifacts from (default "auto" uses latest export build)'
  type: string
  default: 'auto'
- name: fetchOverturePolygons
  displayName: 'Fetch Overture divisions fallback polygons and merge genuinely broken admin relations'
  type: boolean
  default: false
- name: reuseOvertureArtifacts
  displayName: 'Reuse existing overture-polygons artifact from a previous build (skip Overture S3 fetch)'
  type: boolean
  default: false
- name: overtureBuildId
  displayName: 'Specific Build ID to reuse overture-polygons from (default "auto" uses latest overture build)'
  type: string
  default: 'auto'


stages:
- stage: overture
  displayName: 'Fetch Overture fallback polygons'
  condition: and(
    eq('${{ parameters.fetchOverturePolygons }}', true),
    eq('${{ parameters.reuseOvertureArtifacts }}', false))

  jobs:

  - job: fetch_overture
    timeoutInMinutes: 240
    workspace:
      clean: all
    container: osm2parquet

    steps:
    - checkout: self

    - task: Bash@3
      displayName: 'Fetch Overture division fallback geometry'
      inputs:
        targetType: 'inline'
        script: |
          set -eux
          ls -la
          python3 scripts/fetch_overture_polygons.py \
            --candidates scripts/overture-candidates.json \
            --out-dir overture-polygons
          ls -la overture-polygons

    - task: PublishPipelineArtifact@1
      displayName: 'Store Overture fallback polygons'
      inputs:
        targetPath: 'overture-polygons'
        artifact: 'overture-polygons'
        publishLocation: 'pipeline'

- stage: export
  displayName: 'Export polygons from OSM PBF'
  dependsOn: overture
  condition: and(
    eq('${{ parameters.reuseExportArtifacts }}', false),
    in(dependencies.overture.result, 'Succeeded', 'Skipped'))

  jobs:

  # Preflight: verify the PBF download pipeline (definition 9) has published the
  # expected artifacts BEFORE launching the expensive 179-region export matrix.
  # This catches a missing/broken upstream artifact early instead of after minutes
  # of per-region curl fallback downloads.
  - job: artifact_preflight
    displayName: 'Preflight: verify PBF artifacts available from download pipeline'
    timeoutInMinutes: 30
    workspace:
      clean: all
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: 'Probe guadeloupe PBF artifact from download pipeline (definition 9)'
      inputs:
        buildType: 'specific'
        project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
        definition: '9'
        buildVersionToDownload: 'latest'
        itemPattern: 'osm-data-guadeloupe/**'
        targetPath: '$(System.DefaultWorkingDirectory)'
    - bash: |
        set -euo pipefail
        probe="$(System.DefaultWorkingDirectory)/osm-data-guadeloupe/guadeloupe.osm.pbf"
        if [ -f "$probe" ] && [ -s "$probe" ]; then
          echo "[OK] Preflight: guadeloupe PBF artifact available ($(du -h "$probe" | cut -f1))."
          echo "##vso[task.setvariable variable=ARTIFACTS_READY]true"
        else
          echo "****************************************************************"
          echo " ERROR: Preflight failed — no 'osm-data-guadeloupe' artifact found!"
          echo ""
          echo " Cause:"
          echo " The osm-download pipeline (definition 9) has not yet published a"
          echo " complete artifact for the FR-DOM probe region 'guadeloupe'."
          echo ""
          echo " Possible reasons:"
          echo "  - The download pipeline is still running (wait for it to finish)."
          echo "  - The download pipeline build failed for that region."
          echo ""
          echo " Remediation:"
          echo "  Verify build of definition 9 (osm-download) completed, then re-run."
          echo "****************************************************************"
          exit 1
        fi
      displayName: 'Verify guadeloupe PBF artifact present'

  - job: export
    dependsOn: artifact_preflight
    timeoutInMinutes: 360
    workspace:
      clean: all
    container: osmium-tool


    strategy:
