            admin-polygons-*-slovakia/**
            admin-polygons-*-slovenia/**
            admin-polygons-*-spain/**
            admin-polygons-*-sweden/**
            admin-polygons-*-switzerland/**
            admin-polygons-*-turkey/**
            admin-polygons-*-ukraine/**

    steps:
    - checkout: self

    - ${{ if and(ne(parameters.exportBuildId, 'auto'), ne(parameters.exportBuildId, '')) }}:
      - task: DownloadPipelineArtifact@2
        enabled: true
        displayName: 'Download export artifacts from specific build (${{ parameters.exportBuildId }})'
        condition: ${{ eq(parameters.reuseExportArtifacts, true) }}
        inputs:
          buildType: 'specific'
          project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
          definition: '4'
          buildVersionToDownload: 'specific'
          pipelineId: '${{ parameters.exportBuildId }}'
          allowFailedBuilds: true
          allowPartiallySucceededBuilds: true
          itemPattern: $(ARTIFACT_PATTERNS)
          targetPath: '$(System.DefaultWorkingDirectory)'

    - ${{ if or(eq(parameters.exportBuildId, 'auto'), eq(parameters.exportBuildId, '')) }}:
      - task: DownloadPipelineArtifact@2
        enabled: true
        displayName: 'Download export artifacts from latest build with export artifacts'
        condition: ${{ eq(parameters.reuseExportArtifacts, true) }}
        inputs:
          buildType: 'specific'
          project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
          definition: '4'
          buildVersionToDownload: 'latest'
          tags: 'has-export-artifacts'
          allowFailedBuilds: true
          allowPartiallySucceededBuilds: true
          itemPattern: $(ARTIFACT_PATTERNS)
          targetPath: '$(System.DefaultWorkingDirectory)'

    - task: DownloadPipelineArtifact@2
      enabled: true
      displayName: 'Download export artifacts from current build'
      condition: ${{ eq(parameters.reuseExportArtifacts, false) }}
      inputs:
        buildType: 'current'
        itemPattern: $(ARTIFACT_PATTERNS)
        targetPath: '$(System.DefaultWorkingDirectory)'

    - task: Bash@3
      displayName: 'Convert exported GeoJSON streams to GeoParquet'
      inputs:
        workingDirectory: '$(System.DefaultWorkingDirectory)'
        targetType: 'inline'
        script: |
          set -e
          mkdir -p temp_parquet parquet

          echo "=== Downloaded region directories ==="
          find . -maxdepth 2 -type d -name "admin-polygons-*" || true

          # Prune export directories belonging to other continents to conserve runner disk space
          for dir in admin-polygons-*; do
            [ -d "$dir" ] || continue
            keep=false
            for region in $(REGIONS); do
              if [[ "$dir" == *"-${region}"* ]] || [[ "$dir" == *"_${region}"* ]]; then
                keep=true
                break
              fi
            done
            if [ "$keep" = "false" ]; then
              rm -rf "$dir"
            fi
          done

          echo "=== Retained region directories for continent '$(CONTINENT)' ==="
          find . -maxdepth 2 -type d -name "admin-polygons-*" || true

          chmod +x scripts/convert_to_parquet.sh

          for region in $(REGIONS); do
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              [ -s "$file" ] || continue
              filename=$(basename "$file")
              country_code=$(echo "$filename" | cut -d'_' -f1)
              parquet_out="temp_parquet/${filename%.geojsonseq}.parquet"
              echo "Processing $file -> $parquet_out ..."
              ./scripts/convert_to_parquet.sh "$(CONTINENT)" "$country_code" "$file" "$parquet_out"
              rm -rf "$(dirname "$file")"
            done < <(find . -type f \( -name "*_${region}.admin-polygons.geojsonseq" -o -name "${region}.admin-polygons.geojsonseq" \))
          done

          TEMP_COUNT=$(find temp_parquet -name "*.parquet" 2>/dev/null | wc -l)
          if [ "$TEMP_COUNT" -eq 0 ]; then
            echo "****************************************************************"
            echo " ERROR: No GeoParquet files were produced for continent '$(CONTINENT)'!"
            echo "****************************************************************"
            exit 1
          fi

          echo "Merging $TEMP_COUNT country Parquet files into single unified continent Parquet: parquet/admin-polygons-$(CONTINENT).parquet"
          duckdb -c "LOAD spatial;
          COPY (
            SELECT * FROM read_parquet('temp_parquet/*.parquet')
            ORDER BY continent, country_code, admin_level, bbox_miny, bbox_minx
          ) TO 'parquet/admin-polygons-$(CONTINENT).parquet' (
            FORMAT PARQUET,
            COMPRESSION ZSTD,
            ROW_GROUP_SIZE 5000
          );"

          rm -rf temp_parquet
          ls -lh parquet/

    - task: PublishPipelineArtifact@1
      displayName: 'Store GeoParquet continent artifact'
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/parquet/admin-polygons-$(CONTINENT).parquet'
        artifact: 'admin-polygons-parquet-$(CONTINENT)'
        publishLocation: 'pipeline'

    - task: Bash@3
      displayName: 'Cleanup workspace'
      condition: always()
      inputs:
        targetType: 'inline'
        script: |
          rm -rf $(System.DefaultWorkingDirectory)/*


- stage: simplify
  displayName: 'Simplify polygons by continent'
  dependsOn: export
  condition: and(always(), eq('${{ parameters.simplifyPolygons }}', 'true'))

  jobs:
  - job: simplify
    timeoutInMinutes: 360
    workspace:
      clean: all
    container: osm-tools
    strategy:
      matrix:
        africa:
          CONTINENT: 'africa'
          REGIONS: 'algeria angola benin botswana burkina-faso burundi cameroon canary-islands cape-verde central-african-republic chad comores congo-brazzaville congo-democratic-republic djibouti egypt equatorial-guinea eritrea ethiopia gabon ghana guinea guinea-bissau ivory-coast kenya lesotho liberia libya madagascar malawi mali mauritania mauritius morocco mozambique namibia niger nigeria rwanda saint-helena-ascension-and-tristan-da-cunha sao-tome-and-principe senegal-and-gambia seychelles sierra-leone somalia south-africa south-sudan sudan swaziland tanzania togo tunisia uganda zambia zimbabwe'
        asia:
          CONTINENT: 'asia'
          REGIONS: 'afghanistan armenia azerbaijan bangladesh bhutan cambodia china gcc-states india indonesia iran iraq israel-and-palestine japan jordan kazakhstan kyrgyzstan laos lebanon malaysia-singapore-brunei maldives mongolia myanmar nepal north-korea pakistan philippines south-korea sri-lanka syria taiwan tajikistan thailand turkmenistan uzbekistan vietnam yemen'
        australia_oceania:
          CONTINENT: 'australia-oceania'
          REGIONS: 'australia fiji new-caledonia new-zealand papua-new-guinea'
        central_america:
          CONTINENT: 'central-america'
          REGIONS: 'bahamas belize cuba guatemala haiti-and-domrep jamaica nicaragua'
        north_america:
          CONTINENT: 'north-america'
          REGIONS: 'greenland mexico'
        canada:
          CONTINENT: 'canada'
          REGIONS: 'canada'
        us:
          CONTINENT: 'us'
          REGIONS: 'us'
        south_america:
          CONTINENT: 'south-america'
          REGIONS: 'argentina bolivia brazil chile colombia ecuador guyana paraguay peru suriname uruguay venezuela'

        # European heavyweights partitioned into dedicated matrix jobs to avoid runner bottlenecks:
        # - france: ~35,000 administrative communes (admin_level 8)
        # - germany: ~11,000 municipalities/Gemeinden (admin_level 8)
        # - great_britain: ~12,500 civil parishes & wards (admin_level 10)
        # - ireland: >65,000 features (>61,800 historic Townlands/baile fearainn mapped in OSM as admin_level 10)
        france:
          CONTINENT: 'france'
          REGIONS: 'france'
        germany:
          CONTINENT: 'germany'
          REGIONS: 'germany'
        great_britain:
          CONTINENT: 'great-britain'
          REGIONS: 'great-britain'
        ireland:
          CONTINENT: 'ireland'
          REGIONS: 'ireland-and-northern-ireland'
        europe_rest:
          CONTINENT: 'europe-rest'
          REGIONS: 'albania andorra austria azores belarus belgium bosnia-herzegovina bulgaria croatia cyprus czech-republic denmark estonia faroe-islands finland georgia greece hungary iceland isle-of-man italy kosovo latvia liechtenstein lithuania luxembourg macedonia malta moldova monaco montenegro netherlands norway poland portugal romania serbia slovakia slovenia spain sweden switzerland turkey ukraine'
        russia:
          CONTINENT: 'russia'
          REGIONS: 'russia'

    steps:
    - checkout: none #skip checking out the default repository resource

    - ${{ if and(ne(parameters.exportBuildId, 'auto'), ne(parameters.exportBuildId, '')) }}:
      - task: DownloadPipelineArtifact@2
        enabled: true
        displayName: 'Download export artifacts from specific build (${{ parameters.exportBuildId }})'
        condition: ${{ eq(parameters.reuseExportArtifacts, true) }}
        inputs:
          buildType: 'specific'
          project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
          definition: '4'
          buildVersionToDownload: 'specific'
          pipelineId: '${{ parameters.exportBuildId }}'
          allowFailedBuilds: true
          allowPartiallySucceededBuilds: true
          itemPattern: |
            admin-polygons-*/**
            !admin-polygons-simplified*/**
            !admin-polygons-parquet*/**
            !admin-polygons-export-metadata/**
          targetPath: '$(System.DefaultWorkingDirectory)'

    - ${{ if or(eq(parameters.exportBuildId, 'auto'), eq(parameters.exportBuildId, '')) }}:
      - task: DownloadPipelineArtifact@2
        enabled: true
        displayName: 'Download export artifacts from latest build with export artifacts'
        condition: ${{ eq(parameters.reuseExportArtifacts, true) }}
        inputs:
          buildType: 'specific'
          project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
          definition: '4'
          buildVersionToDownload: 'latest'
          tags: 'has-export-artifacts'
          allowFailedBuilds: true
          allowPartiallySucceededBuilds: true
          itemPattern: |
            admin-polygons-*/**
            !admin-polygons-simplified*/**
            !admin-polygons-parquet*/**
            !admin-polygons-export-metadata/**
          targetPath: '$(System.DefaultWorkingDirectory)'

    - task: DownloadPipelineArtifact@2
      enabled: true
      displayName: 'Download export artifacts from current build'
      condition: ${{ eq(parameters.reuseExportArtifacts, false) }}
      inputs:
        buildType: 'current'
        itemPattern: |
          admin-polygons-*/**
          !admin-polygons-simplified*/**
          !admin-polygons-parquet*/**
          !admin-polygons-export-metadata/**
        targetPath: '$(System.DefaultWorkingDirectory)'

    - task: Bash@3
      enabled: true
      displayName: 'simplify polygons'
      inputs:
        workingDirectory: '$(System.DefaultWorkingDirectory)'
        targetType: 'inline'
        script: |
          set -e
          export JAVA_TOOL_OPTIONS="-Xmx6g"
          mkdir -p simplified

          # Prune export directories belonging to other continents to conserve runner disk space
          for dir in admin-polygons-*; do
            [ -d "$dir" ] || continue
            keep=false
            for region in $(REGIONS); do
              if [[ "$dir" == *"-${region}"* ]] || [[ "$dir" == *"_${region}"* ]]; then
                keep=true
                break
              fi
            done
            if [ "$keep" = "false" ]; then
              rm -rf "$dir"
            fi
          done
          echo "Pruned non-target region directories from workspace."

          for region in $(REGIONS); do
            find . -type f \( -name "*_${region}.admin-polygons.geojsonseq" -o -name "${region}.admin-polygons.geojsonseq" \) | while read -r file; do
              if [ ! -s "$file" ]; then
                echo "WARNING: File $file is empty (0 bytes). Skipping simplification."
                rm -f "$file"
                continue
              fi
              echo "Simplifying $file ($(wc -l < "$file") features)..."
              /simplify.sh "$file"
              SIMPLIFIED_OUTPUT=$(find $(dirname "$file") -name "*.simplified.geojsonseq" | head -n 1)
              if [ -n "$SIMPLIFIED_OUTPUT" ] && [ -f "$SIMPLIFIED_OUTPUT" ]; then
                mv "$SIMPLIFIED_OUTPUT" "simplified/$(basename "$file")"
              fi
              rm -rf "$(dirname "$file")"
            done
          done



          # Copy export metadata if present
          find . -name "export-info.json" -exec cp {} simplified/export-info.json \; 2>/dev/null || true

          # Save osm-tools container git version info
          unzip -p /app/app.jar git.properties > simplified/osm-tools-version.info 2>/dev/null || true

          ls -laR simplified/

          SIMPLIFIED_COUNT=$(find simplified -name "*.geojsonseq" | wc -l)
          if [ "$SIMPLIFIED_COUNT" -eq 0 ]; then
            echo "****************************************************************"
            echo " ERROR: No simplified polygon files were produced for continent '$(CONTINENT)'!"
            echo ""
            echo " Cause:"
            echo " Upstream export artifacts for regions in '$(CONTINENT)' were missing"
            echo " or contained 0 features."
            echo ""
            echo " Solution:"
            echo " Check upstream 'export' stage logs to verify .geojsonseq artifacts"
            echo " were generated and downloaded correctly."
            echo "****************************************************************"
            exit 1
          fi

          tar cfz simplified-$(CONTINENT).tar.gz simplified/



    - task: PublishPipelineArtifact@1
      enabled: true
      displayName: 'Store simplified continent artifact'
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/simplified-$(CONTINENT).tar.gz'
        artifact: 'admin-polygons-simplified-$(CONTINENT)'
        publishLocation: 'pipeline'

    - task: Bash@3
      displayName: 'Cleanup workspace'
      condition: always()
      inputs:
        targetType: 'inline'
        script: |
          rm -rf $(System.DefaultWorkingDirectory)/*

- stage: package
  displayName: 'Package global simplified & GeoParquet polygons'
  dependsOn:
  - simplify
  - parquet
  condition: or(succeeded('simplify'), succeeded('parquet'))

  jobs:
  - job: package
    timeoutInMinutes: 360
    workspace:
      clean: all
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - task: DownloadPipelineArtifact@2
      enabled: true
      displayName: 'Download all simplified continent artifacts'
      continueOnError: true
      inputs:
        buildType: 'current'
        buildVersionToDownload: 'latest'
        itemPattern: 'admin-polygons-simplified-*/**'
        targetPath: '$(System.DefaultWorkingDirectory)/archives'

    - task: DownloadPipelineArtifact@2
      enabled: true
      displayName: 'Download all GeoParquet continent artifacts'
      continueOnError: true
      inputs:
        buildType: 'current'
        buildVersionToDownload: 'latest'
        itemPattern: 'admin-polygons-parquet-*/**'
        targetPath: '$(System.DefaultWorkingDirectory)/parquet_archives'

    - task: Bash@3
      enabled: true
      displayName: 'Bundle global artifact & generate admin_level statistics'
      inputs:
        targetType: 'inline'
        script: |
          set -e
          set -x
          mkdir -p simplified
          if [ -d "archives" ]; then
            find archives -name "simplified-*.tar.gz" | while read -r archive; do
              tar xfz "$archive" -C . || true
            done
          fi

          mkdir -p parquet_continents parquet_global
          if [ -d "parquet_archives" ]; then
            find parquet_archives -type f -name "*.parquet" -exec cp {} parquet_continents/ \;
            PARQUET_FILE_COUNT=$(find parquet_continents -type f -name "*.parquet" | wc -l)
            echo "Found $PARQUET_FILE_COUNT continental GeoParquet files:"
            ls -lh parquet_continents/
            if [ "$PARQUET_FILE_COUNT" -gt 0 ]; then
              echo "Merging $PARQUET_FILE_COUNT continental GeoParquet files into global admin-polygons-all.parquet..."
              docker run --rm -v $(System.DefaultWorkingDirectory):/workspace -w /workspace ghcr.io/krizleebear/osm2parquet:v1.0.5 duckdb -c "LOAD spatial;
              COPY (
                SELECT * FROM read_parquet('parquet_continents/*.parquet')
              ) TO 'parquet_global/admin-polygons-all.parquet' (
                FORMAT PARQUET,
                COMPRESSION ZSTD,
                ROW_GROUP_SIZE 5000
              );"

              if [ ! -s "parquet_global/admin-polygons-all.parquet" ]; then
                echo "****************************************************************"
                echo " ERROR: parquet_global/admin-polygons-all.parquet is empty (0 bytes)!"
                echo "****************************************************************"
                exit 1
              fi

              echo "Global GeoParquet generated successfully:"
              ls -lh parquet_global/admin-polygons-all.parquet
            fi
          fi

          OSM_TOOLS_COMMIT=$(grep "git.commit.id.full" simplified/osm-tools-version.info 2>/dev/null | cut -d'=' -f2 || echo "")
          OSM_TOOLS_BUILD_TIME=$(grep "git.build.time" simplified/osm-tools-version.info 2>/dev/null | cut -d'=' -f2 || echo "")

          if [ -z "$OSM_TOOLS_COMMIT" ] || [ "$OSM_TOOLS_COMMIT" = "latest" ]; then
            OSM_TOOLS_COMMIT="2b3843cecae063416c0622eb978d31527c119008"
          fi

          # Extract and parse export metadata
          EXPORTED_AT=""
          EXPORT_COMMIT=""
          EXPORT_BUILD_ID=""
          EXPORT_BUILD_NUM=""
          if [ -f "simplified/export-info.json" ]; then
            EXPORTED_AT=$(jq -r '.exported_at // ""' simplified/export-info.json 2>/dev/null || echo "")
            EXPORT_COMMIT=$(jq -r '.export_pipeline_commit // ""' simplified/export-info.json 2>/dev/null || echo "")
            EXPORT_BUILD_ID=$(jq -r '.export_build_id // ""' simplified/export-info.json 2>/dev/null || echo "")
            EXPORT_BUILD_NUM=$(jq -r '.export_build_number // ""' simplified/export-info.json 2>/dev/null || echo "")
          fi

          if [ -z "$EXPORTED_AT" ]; then
            EXPORTED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          fi
          if [ -z "$EXPORT_COMMIT" ]; then
            EXPORT_COMMIT="$(Build.SourceVersion)"
          fi
          if [ -z "$EXPORT_BUILD_ID" ]; then
            EXPORT_BUILD_ID="$(Build.BuildId)"
          fi
          if [ -z "$EXPORT_BUILD_NUM" ]; then
            EXPORT_BUILD_NUM="$(Build.BuildNumber)"
          fi

          REUSED_EXPORT=false
          if [ "${{ parameters.reuseExportArtifacts }}" = "true" ] || [ "${{ parameters.reuseExportArtifacts }}" = "True" ] || [ "$EXPORT_BUILD_ID" != "$(Build.BuildId)" ]; then
            REUSED_EXPORT=true
          fi

          # Generate export-info.json and metadata artifact
          cat <<EOF > export-info.json
          {
            "exported_at": "$EXPORTED_AT",
            "export_pipeline_commit": "$EXPORT_COMMIT",
            "export_build_id": "$EXPORT_BUILD_ID",
            "export_build_number": "$EXPORT_BUILD_NUM",
            "release_pipeline_commit": "$(Build.SourceVersion)",
            "release_build_id": "$(Build.BuildId)",
            "release_build_number": "$(Build.BuildNumber)",
            "osm_tools_commit": "$OSM_TOOLS_COMMIT",
            "osm_tools_build_time": "$OSM_TOOLS_BUILD_TIME",
            "reused_export_artifacts": $REUSED_EXPORT
          }
          EOF

          cat export-info.json

          SIMPLIFIED_COUNT=$(find simplified -name "*.geojsonseq" | wc -l)
          if [ "$SIMPLIFIED_COUNT" -gt 0 ]; then
            python3 scripts/generate_release_stats.py simplified || true
            tar cfz simplified.tar.gz simplified/
          fi

          PARQUET_TOTAL=$(find parquet_continents -name "*.parquet" 2>/dev/null | wc -l)
          echo "Total continental GeoParquet files merged: $PARQUET_TOTAL"

    - task: PublishPipelineArtifact@1
      enabled: true
      displayName: 'Store global simplified artifact'
      condition: and(succeeded(), eq('${{ parameters.simplifyPolygons }}', 'true'))
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/simplified.tar.gz'
        artifact: 'admin-polygons-simplified'
        publishLocation: 'pipeline'

    - task: PublishPipelineArtifact@1
      enabled: true
      displayName: 'Store global GeoParquet dataset'
      condition: and(succeeded(), eq('${{ parameters.exportParquet }}', 'true'))
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/parquet_global/admin-polygons-all.parquet'
        artifact: 'admin-polygons-parquet-all'
        publishLocation: 'pipeline'

    - task: PublishPipelineArtifact@1
      enabled: true
      displayName: 'Store admin-level statistics artifact'
      condition: and(succeeded(), eq('${{ parameters.simplifyPolygons }}', 'true'))
      continueOnError: true
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/simplified/admin-levels-summary.md'
        artifact: 'admin-levels-summary'
        publishLocation: 'pipeline'

    - task: Bash@3
      displayName: 'Cleanup workspace'
      condition: always()
      inputs:
        targetType: 'inline'
        script: |
          rm -rf $(System.DefaultWorkingDirectory)/*
