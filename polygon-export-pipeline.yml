# OSM polygon export pipeline
# Exports polygons of localities to geoJSON streams.
name: polygon-pipeline

resources:
  containers:
  - container: osmium-tool
    #image: krizleebear/docker-osmium-tool:v1.18.0
    image: mirror.gcr.io/krizleebear/docker-osmium-tool:v1.18.0
    #endpoint: docker-krizleebear
  - container: osm-tools
    #image: krizleebear/osm-tools:latest
    image: mirror.gcr.io/krizleebear/osm-tools:latest
    #endpoint: docker-krizleebear

trigger:
- none

pool:
  vmImage: 'ubuntu-latest'

parameters:
- name: reuseExportArtifacts
  displayName: 'Reuse existing exported .geojsonseq artifacts (Skip slow PBF filter stage)'
  type: boolean
  default: false
- name: requireWikidata
  displayName: 'Require wikidata tag on exported polygons (If false, only require admin_level and name)'
  type: boolean
  default: false


stages:
- stage: export
  displayName: 'Export polygons from OSM PBF'
  condition: eq('${{ parameters.reuseExportArtifacts }}', false)

  jobs:

  - job: export
    timeoutInMinutes: 360
    workspace:
      clean: all
    container: osmium-tool


    strategy:
      matrix:
