  # Note on Geofabrik multi-country composite extracts:
  # Geofabrik provides several combined regional extracts (e.g. gcc-states, malaysia-singapore-brunei,
  # senegal-and-gambia, haiti-and-domrep, israel-and-palestine, ireland-and-northern-ireland).
  # Each matrix entry uses the primary ISO 3166-1 alpha-2 country code for filename prefixes (e.g. AE, MY, SN, HT, IL, IE).
  # Distinct country tags (ISO3166-1 / ISO3166-2) within OSM features remain preserved in the exported dataset.

    steps:

    - task: DownloadPipelineArtifact@2
      enabled: true
      inputs:
        buildType: 'specific'
        project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
        definition: '9'
        buildVersionToDownload: 'latest'
        itemPattern: 'osm-data-$(OSM_REGION)/$(OSM_REGION).osm.pbf'
        targetPath: '$(System.DefaultWorkingDirectory)'

    - task: Bash@3
      enabled: true
      displayName: 'filter and export polygons'
      inputs:
        targetType: 'inline'
        script: |
          set -x
          ls -la
          pwd
          osmium --version

          INPUT_PBF=osm-data-$(OSM_REGION)/$(OSM_REGION).osm.pbf
          if [ ! -f "$INPUT_PBF" ]; then
            echo "[INFO] No pre-downloaded artifact found for region '$(OSM_REGION)'."
            echo "[INFO] Downloading PBF directly from Geofabrik: $(PBF_URL)"

            # Portable download: try curl, then wget, then python3 (urllib).
            # The CI container image may not ship curl/wget, so fall back gracefully.
            download_file() {
              local url="$1" out="$2"
              if command -v curl >/dev/null 2>&1; then
                curl --fail --location --retry 3 --retry-delay 10 --output "$out" "$url"
              elif command -v wget >/dev/null 2>&1; then
                wget --tries=3 --retry-connrefused --waitretry=10 --timeout=60 -O "$out" "$url"
              elif command -v python3 >/dev/null 2>&1; then
                python3 -c 'import sys, urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])' "$url" "$out"
              else
                echo "ERROR: No download tool (curl/wget/python3) available in container." >&2
                return 1
              fi
            }

            mkdir -p "osm-data-$(OSM_REGION)"
            download_file "$(PBF_URL)" "$INPUT_PBF"
            if [ ! -f "$INPUT_PBF" ] || [ ! -s "$INPUT_PBF" ]; then
              echo "****************************************************************"
              echo " ERROR: Failed to download PBF for region '$(OSM_REGION)'!"
              echo ""
              echo " URL: $(PBF_URL)"
              echo ""
              echo " Cause:"
              echo " The direct Geofabrik download failed (network error, HTTP error,"
              echo " missing download tool, or the URL is incorrect)."
              echo ""
              echo " Solution:"
              echo " Verify PBF_URL in the export matrix is correct and Geofabrik"
              echo " is reachable from the Azure DevOps runner."
              echo "****************************************************************"
              exit 1
            fi
            echo "[INFO] Direct download complete: $(du -h "$INPUT_PBF" | cut -f1)"
          fi
          ADMIN_PBF=$(OSM_REGION).admins.pbf
          POLYGON_JSON=$(COUNTRY_CODE)_$(OSM_REGION).admin-polygons.geojsonseq
          PLACES_PBF=$(OSM_REGION).places.pbf
          PLACES_JSONL=$(COUNTRY_CODE)_$(OSM_REGION).places.jsonl

          # Step 1: Filter administrative and place boundaries (broad osmium filter, expressions OR-combined;
          # precise sub-municipal refinement happens in filter_polygons.py per SPEC_OSM_POLYGONS_SUBDIVISIONS.md & feat/named-areas):
          # - Rule 1: boundary=administrative (admin_level 2..11)
          # - Rule 2: boundary=traditional,statistical,cadastral,local_authority,borough
          # - Rule 3: relations & closed ways with place=suburb,quarter,borough,neighbourhood,city_block,hamlet,village,locality
          osmium tags-filter --output ${ADMIN_PBF} --overwrite ${INPUT_PBF} \
            boundary=administrative,traditional,statistical,cadastral,local_authority,borough \
            r/place=suburb,quarter,borough,neighbourhood,city_block,hamlet,village,locality \
            w/place=suburb,quarter,borough,neighbourhood,city_block,hamlet,village,locality

          # Step 2b: Filter OSM place nodes companion dataset (points) per PLACE_NODE_EXPORTER_SPEC.md:
          osmium tags-filter --output ${PLACES_PBF} --overwrite ${INPUT_PBF} \
            n/place=city,town,municipality,commune,suburb,quarter,neighbourhood,city_block,townlet,village,hamlet,isolated_dwelling,locality

          # Step 3: Validate PBF for broken admin boundary references and generate synthetic parent definitions
          python3 scripts/validate_pbf.py ${INPUT_PBF} --country $(COUNTRY_CODE) || true
          SYNTHETIC_DEFS=$(echo ${INPUT_PBF} | sed 's/.osm.pbf/-synthetic-defs.json/')
          PARENT_MAPPING=$(echo ${INPUT_PBF} | sed 's/.osm.pbf/-parent-mapping.json/')
          VALIDATION_JSON=$(echo ${INPUT_PBF} | sed 's/.osm.pbf/-validation.json/')
          if [ -f "${SYNTHETIC_DEFS}" ]; then
            cp ${SYNTHETIC_DEFS} ./synthetic-defs.json
            SYNTHETIC_DEFS=./synthetic-defs.json
          else
            SYNTHETIC_DEFS=""
          fi
          if [ -f "${PARENT_MAPPING}" ]; then
            cp ${PARENT_MAPPING} ./parent-mapping.json
            PARENT_MAPPING=./parent-mapping.json
          else
            PARENT_MAPPING=""
          fi
          if [ -f "${VALIDATION_JSON}" ]; then
            cp ${VALIDATION_JSON} ./validation.json
          fi

          # Reclaim disk space: Remove heavy raw input PBF immediately after filtering
          rm -rf osm-data-$(OSM_REGION)

          # Step 4: Stream export polygons directly to stdout and filter/enhance with filter_polygons.py
          osmium export ${ADMIN_PBF} --output-format=geojsonseq --overwrite --config=osmium-export-config.json \
            | python3 scripts/filter_polygons.py --country-code $(COUNTRY_CODE) --admin-pbf ${ADMIN_PBF} ${SYNTHETIC_DEFS:+--synthetic-defs ${SYNTHETIC_DEFS}} ${PARENT_MAPPING:+--parent-mapping ${PARENT_MAPPING}} > ${POLYGON_JSON}
          rm -f ${ADMIN_PBF}

          # Step 5: Stream export place nodes directly to stdout and structure with filter_places.py
          osmium export ${PLACES_PBF} --output-format=geojsonseq --overwrite --config=osmium-export-config.json \
            | python3 scripts/filter_places.py --country-code $(COUNTRY_CODE) > ${PLACES_JSONL}
          rm -f ${PLACES_PBF}

          # Step 6: Determine dynamically if this region has Overture fallback candidates
          IS_CANDIDATE=$(python3 -c "import json; c=json.load(open('scripts/overture-candidates.json')); print('true' if any(x.get('country')=='$(COUNTRY_CODE)' for x in c.get('candidates', [])) else 'false')")
          echo "##vso[task.setvariable variable=IS_OVERTURE_CANDIDATE]$IS_CANDIDATE"

    - task: PublishPipelineArtifact@1
      enabled: true
      displayName: 'Store raw polygon artifacts (for Overture fallback candidate regions)'
      condition: and(succeeded(), eq('${{ parameters.fetchOverturePolygons }}', true), eq(variables['IS_OVERTURE_CANDIDATE'], 'true'))
      inputs:
        targetPath: '$(COUNTRY_CODE)_$(OSM_REGION).admin-polygons.geojsonseq'
        artifact: 'raw-admin-polygons-$(COUNTRY_CODE)-$(OSM_REGION)'
        publishLocation: 'pipeline'

    - task: PublishPipelineArtifact@1
      enabled: true
      displayName: 'Store polygon artifacts'
      condition: and(succeeded(), or(ne('${{ parameters.fetchOverturePolygons }}', true), ne(variables['IS_OVERTURE_CANDIDATE'], 'true')))
      inputs:
        targetPath: '$(COUNTRY_CODE)_$(OSM_REGION).admin-polygons.geojsonseq'
        artifact: 'admin-polygons-$(COUNTRY_CODE)-$(OSM_REGION)'
        publishLocation: 'pipeline'

    - task: PublishPipelineArtifact@1
      enabled: true
      displayName: 'Store validation artifacts'
      continueOnError: true
      inputs:
        targetPath: 'validation.json'
        artifact: 'validation-$(COUNTRY_CODE)-$(OSM_REGION)'
        publishLocation: 'pipeline'

    - task: PublishPipelineArtifact@1
      enabled: true
      displayName: 'Store place nodes artifacts'
      inputs:
        targetPath: '$(COUNTRY_CODE)_$(OSM_REGION).places.jsonl'
        artifact: 'places-$(COUNTRY_CODE)-$(OSM_REGION)'
        publishLocation: 'pipeline'

    - task: Bash@3
      displayName: 'Cleanup workspace'
      condition: always()
      inputs:
        targetType: 'inline'
        script: |
          rm -rf $(System.DefaultWorkingDirectory)/*

  - job: merge_overture
    displayName: 'Merge Overture fallback polygons (insert + health-check replace)'
    # Runs AFTER export in the osm2parquet container: DuckDB spatial powers the
    # health check that replaces present-but-damaged candidate polygons with the
    # Overture LAND geometry (see scripts/merge_overture_polygons.py).
    dependsOn: export
    condition: and(succeeded(), eq('${{ parameters.fetchOverturePolygons }}', true))
    timeoutInMinutes: 120
    workspace:
      clean: all
    container: osm2parquet
    strategy:
      matrix:
        burkina-faso:
          REGION: 'burkina-faso'
          COUNTRY_CODE: 'BF'
        bhutan:
          REGION: 'bhutan'
          COUNTRY_CODE: 'BT'
        belize:
          REGION: 'belize'
          COUNTRY_CODE: 'BZ'
        china:
          REGION: 'china'
          COUNTRY_CODE: 'CN'
        spain:
          REGION: 'spain'
          COUNTRY_CODE: 'ES'
        canary-islands:
          REGION: 'canary-islands'
          COUNTRY_CODE: 'ES'
        france:
          REGION: 'france'
          COUNTRY_CODE: 'FR'
        great-britain:
          REGION: 'great-britain'
          COUNTRY_CODE: 'GB'
        haiti-and-domrep:
          REGION: 'haiti-and-domrep'
          COUNTRY_CODE: 'HT'
        indonesia:
          REGION: 'indonesia'
          COUNTRY_CODE: 'ID'
        iran:
          REGION: 'iran'
          COUNTRY_CODE: 'IR'
        north-korea:
          REGION: 'north-korea'
          COUNTRY_CODE: 'KP'
        malaysia-singapore-brunei:
          REGION: 'malaysia-singapore-brunei'
          COUNTRY_CODE: 'MY'
        nigeria:
          REGION: 'nigeria'
          COUNTRY_CODE: 'NG'
        netherlands:
          REGION: 'netherlands'
          COUNTRY_CODE: 'NL'
        norway:
          REGION: 'norway'
          COUNTRY_CODE: 'NO'
        papua-new-guinea:
          REGION: 'papua-new-guinea'
          COUNTRY_CODE: 'PG'
        philippines:
          REGION: 'philippines'
          COUNTRY_CODE: 'PH'
        portugal:
          REGION: 'portugal'
          COUNTRY_CODE: 'PT'
        sudan:
          REGION: 'sudan'
          COUNTRY_CODE: 'SD'
        suriname:
          REGION: 'suriname'
          COUNTRY_CODE: 'SR'
        taiwan:
          REGION: 'taiwan'
          COUNTRY_CODE: 'TW'
        tanzania:
          REGION: 'tanzania'
          COUNTRY_CODE: 'TZ'
        us:
          REGION: 'us'
          COUNTRY_CODE: 'US'
        vietnam:
          REGION: 'vietnam'
          COUNTRY_CODE: 'VN'
        kosovo:
          REGION: 'kosovo'
          COUNTRY_CODE: 'XK'

    steps:
    - checkout: self

    - ${{ if and(ne(parameters.overtureBuildId, 'auto'), ne(parameters.overtureBuildId, '')) }}:
      - task: DownloadPipelineArtifact@2
        displayName: 'Download Overture fallback polygons from specific build (${{ parameters.overtureBuildId }})'
        condition: ${{ eq(parameters.reuseOvertureArtifacts, true) }}
        inputs:
          buildType: 'specific'
          project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
          definition: '4'
          buildVersionToDownload: 'specific'
          pipelineId: '${{ parameters.overtureBuildId }}'
          allowFailedBuilds: true
          allowPartiallySucceededBuilds: true
          itemPattern: 'overture-polygons/**'
          targetPath: '$(System.DefaultWorkingDirectory)'

    - ${{ if or(eq(parameters.overtureBuildId, 'auto'), eq(parameters.overtureBuildId, '')) }}:
      - task: DownloadPipelineArtifact@2
        displayName: 'Download Overture fallback polygons from latest overture build'
        condition: ${{ eq(parameters.reuseOvertureArtifacts, true) }}
        inputs:
          buildType: 'specific'
          project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
          definition: '4'
          buildVersionToDownload: 'latest'
          allowFailedBuilds: true
          allowPartiallySucceededBuilds: true
          itemPattern: 'overture-polygons/**'
          targetPath: '$(System.DefaultWorkingDirectory)'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Overture fallback polygons from current build'
      condition: ${{ eq(parameters.reuseOvertureArtifacts, false) }}
      inputs:
        buildType: 'current'
        itemPattern: 'overture-polygons/**'
        targetPath: '$(System.DefaultWorkingDirectory)'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download raw region polygon & validation artifacts'
      inputs:
        buildType: 'current'
        itemPattern: |
          raw-admin-polygons-$(COUNTRY_CODE)-$(REGION)/**
          validation-$(COUNTRY_CODE)-$(REGION)/**
        targetPath: '$(System.DefaultWorkingDirectory)'

    - task: Bash@3
      displayName: 'Merge Overture fallback polygons'
      inputs:
        targetType: 'inline'
        script: |
          set -eux
          STREAM=$(find "raw-admin-polygons-$(COUNTRY_CODE)-$(REGION)" -name "*.admin-polygons.geojsonseq" | head -n 1)
          if [ -z "$STREAM" ] || [ ! -s "$STREAM" ]; then
            echo " ERROR: no raw polygon stream found for '$(COUNTRY_CODE)/$(REGION)'."
            echo " Cause: export job for this region did not publish a raw-admin-polygons artifact,"
            echo " or it is empty (0 bytes)."
            exit 1
          fi
          VALIDATION=$(find "validation-$(COUNTRY_CODE)-$(REGION)" -name "validation.json" | head -n 1)
          if [ -z "$VALIDATION" ]; then
            echo " ERROR: validation.json missing for '$(COUNTRY_CODE)/$(REGION)'."
            echo " Cause: the region's validation artifact was not published by the export job."
            exit 1
          fi
          mkdir -p "admin-polygons-$(COUNTRY_CODE)-$(REGION)"
          TARGET="admin-polygons-$(COUNTRY_CODE)-$(REGION)/$(COUNTRY_CODE)_$(REGION).admin-polygons.geojsonseq"
          python3 scripts/merge_overture_polygons.py "$STREAM" \
            --validation "$VALIDATION" \
            --overture overture-polygons/overture.geojsonseq \
            --candidates scripts/overture-candidates.json \
            --country-code $(COUNTRY_CODE) > "$TARGET"

    - task: PublishPipelineArtifact@1
      displayName: 'Store merged polygon artifacts'
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/admin-polygons-$(COUNTRY_CODE)-$(REGION)'
        artifact: 'admin-polygons-$(COUNTRY_CODE)-$(REGION)'
        publishLocation: 'pipeline'

  - job: tag_export
    displayName: 'Tag build with export artifacts & save metadata'
    dependsOn: export
    condition: succeeded()
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: none
    - bash: |
        set -e
        mkdir -p export_meta
        cat <<EOF > export_meta/export-info.json
        {
          "exported_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
          "export_pipeline_commit": "$(Build.SourceVersion)",
          "export_build_number": "$(Build.BuildNumber)",
          "export_build_id": "$(Build.BuildId)",
          "osmium_tool_image": "v1.19.0"
        }
        EOF
        echo "##vso[build.addbuildtag]has-export-artifacts"
      displayName: 'Record export metadata and add build tag'
    - task: PublishPipelineArtifact@1
      displayName: 'Store export metadata artifact'
      inputs:
        targetPath: 'export_meta'
        artifact: 'admin-polygons-export-metadata'
        publishLocation: 'pipeline'


- stage: parquet
  displayName: 'Convert to GeoParquet by country'
  dependsOn: export
  condition: in(dependencies.export.result, 'Succeeded', 'Skipped')

  jobs:
