# OSM polygon export pipeline
# Exports polygons of localities to geoJSON streams.
name: polygon-pipeline

resources:
  containers:
  - container: osmium-tool
    # Use mirror.gcr.io to prevent Docker Hub pull rate limits during multi-job matrix execution
    image: mirror.gcr.io/krizleebear/docker-osmium-tool:v1.19.0
    #image: krizleebear/docker-osmium-tool:v1.19.0
    #endpoint: docker-krizleebear
  - container: osm-tools
    #image: krizleebear/osm-tools:latest
    image: mirror.gcr.io/krizleebear/osm-tools:master-2b3843cecae063416c0622eb978d31527c119008
    #endpoint: docker-krizleebear
  - container: osm2parquet
    # DuckDB spatial converter for unsimplified GeoParquet 1.1 exports
    image: ghcr.io/krizleebear/osm2parquet:v1.0.5

trigger:
- none

pool:
  vmImage: 'ubuntu-latest'

parameters:
- name: exportParquet
  displayName: 'Generate GeoParquet artifacts (OGC GeoParquet 1.1 unsimplified, 0% border-bleeding)'
  type: boolean
  default: true
- name: simplifyPolygons
  displayName: 'Run polygon simplification (osm-tools Java simplifier)'
  type: boolean
  default: true
- name: reuseExportArtifacts
  displayName: 'Reuse existing exported .geojsonseq artifacts (Skip slow PBF filter stage)'
  type: boolean
  default: false
- name: exportBuildId
  displayName: 'Specific Build ID to reuse export artifacts from (default "auto" uses latest export build)'
  type: string
  default: 'auto'
- name: requireWikidata
  displayName: 'Require wikidata tag on exported polygons (If false, only require admin_level and name)'
  type: boolean
  default: false


stages:
- stage: export
  displayName: 'Export polygons from OSM PBF'
  condition: eq('${{ parameters.reuseExportArtifacts }}', false)

  jobs:

  - job: export
    timeoutInMinutes: 360
    workspace:
      clean: all
    container: osmium-tool


