            *-romania/**
            *-serbia/**
            *-slovakia/**
            *-slovenia/**
            *-spain/**
            *-sweden/**
            *-switzerland/**
            *-ukraine/**

    steps:
    - checkout: self

    - ${{ if and(ne(parameters.exportBuildId, 'auto'), ne(parameters.exportBuildId, '')) }}:
      - task: DownloadPipelineArtifact@2
        enabled: true
        displayName: 'Download export artifacts from specific build (${{ parameters.exportBuildId }})'
        condition: ${{ eq(parameters.reuseExportArtifacts, true) }}
        inputs:
          buildType: 'specific'
          project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
          definition: '4'
          buildVersionToDownload: 'specific'
          pipelineId: '${{ parameters.exportBuildId }}'
          allowFailedBuilds: true
          allowPartiallySucceededBuilds: true
          itemPattern: $(ARTIFACT_PATTERNS)
          targetPath: '$(System.DefaultWorkingDirectory)'

    - ${{ if or(eq(parameters.exportBuildId, 'auto'), eq(parameters.exportBuildId, '')) }}:
      - task: DownloadPipelineArtifact@2
        enabled: true
        displayName: 'Download export artifacts from latest build with export artifacts'
        condition: ${{ eq(parameters.reuseExportArtifacts, true) }}
        inputs:
          buildType: 'specific'
          project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
          definition: '4'
          buildVersionToDownload: 'latest'
          tags: 'has-export-artifacts'
          allowFailedBuilds: true
          allowPartiallySucceededBuilds: true
          itemPattern: $(ARTIFACT_PATTERNS)
          targetPath: '$(System.DefaultWorkingDirectory)'

    - task: DownloadPipelineArtifact@2
      enabled: true
      displayName: 'Download export artifacts from current build'
      condition: ${{ eq(parameters.reuseExportArtifacts, false) }}
      inputs:
        buildType: 'current'
        itemPattern: $(ARTIFACT_PATTERNS)
        targetPath: '$(System.DefaultWorkingDirectory)'

    - task: Bash@3
      displayName: 'Convert exported GeoJSON streams to GeoParquet'
      inputs:
        workingDirectory: '$(System.DefaultWorkingDirectory)'
        targetType: 'inline'
        script: |
          set -e
          mkdir -p temp_parquet parquet

          echo "=== Downloaded region directories ==="
          find . -maxdepth 2 -type d -name "admin-polygons-*" || true

          # Prune export directories belonging to other continents to conserve runner disk space
          for dir in admin-polygons-* places-*; do
            [ -d "$dir" ] || continue
            keep=false
            for region in $(REGIONS); do
              if [[ "$dir" == *"-${region}"* ]] || [[ "$dir" == *"_${region}"* ]]; then
                keep=true
                break
              fi
            done
            if [ "$keep" = "false" ]; then
              rm -rf "$dir"
            fi
          done

          echo "=== Retained region directories for continent '$(CONTINENT)' ==="
          find . -maxdepth 2 -type d \( -name "admin-polygons-*" -o -name "places-*" \) || true

          chmod +x scripts/convert_to_parquet.sh scripts/convert_places_to_parquet.sh
          mkdir -p temp_parquet temp_places_parquet parquet

          for region in $(REGIONS); do
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              [ -s "$file" ] || continue
              filename=$(basename "$file")
              # matrix_cc is the primary country code from the export job filename prefix
              matrix_cc=$(echo "$filename" | cut -d'_' -f1)
              parquet_out="temp_parquet/${filename%.geojsonseq}.parquet"
              echo "Processing polygons $file -> $parquet_out ..."
              # continent and country_code are derived inside convert_to_parquet.sh from features + countries.json
              ./scripts/convert_to_parquet.sh "$matrix_cc" "$file" "$parquet_out"
              rm -rf "$(dirname "$file")"
            done < <(find . -type f \( -name "*_${region}.admin-polygons.geojsonseq" -o -name "${region}.admin-polygons.geojsonseq" \) -not -path "*/raw-admin-polygons-*/*")

            while IFS= read -r file; do
              [ -n "$file" ] || continue
              [ -s "$file" ] || continue
              filename=$(basename "$file")
              matrix_cc=$(echo "$filename" | cut -d'_' -f1)
              places_out="temp_places_parquet/${filename%.jsonl}.parquet"
              echo "Processing places $file -> $places_out ..."
              ./scripts/convert_places_to_parquet.sh "$matrix_cc" "$file" "$places_out"
              rm -rf "$(dirname "$file")"
            done < <(find . -type f \( -name "*_${region}.places.jsonl" -o -name "${region}.places.jsonl" \))
          done

          TEMP_COUNT=$(find temp_parquet -name "*.parquet" 2>/dev/null | wc -l)
          if [ "$TEMP_COUNT" -eq 0 ]; then
            echo "****************************************************************"
            echo " ERROR: No GeoParquet files were produced for continent '$(CONTINENT)'!"
            echo "****************************************************************"
            exit 1
          fi

          # Merge per-region temp parquets into per-country parquets (groups spain+canary-islands -> ES, etc.)
          echo "Producing per-country GeoParquet files from $TEMP_COUNT region parquet(s)..."
          duckdb -c "LOAD spatial;
          CREATE TABLE combined AS SELECT * FROM read_parquet('temp_parquet/*.parquet');
          CREATE TABLE country_list AS SELECT DISTINCT country_code FROM combined ORDER BY country_code;
          SELECT country_code, count(*) AS features FROM combined GROUP BY country_code ORDER BY country_code;
          " > /tmp/country_summary.txt 2>&1 || true
          cat /tmp/country_summary.txt || true

          duckdb << 'DUCKDB_EOF'
          LOAD spatial;
          CREATE TABLE combined AS SELECT * FROM read_parquet('temp_parquet/*.parquet');
          SELECT DISTINCT country_code FROM combined ORDER BY country_code;
          DUCKDB_EOF

          # Write one parquet per country_code
          duckdb -c "
          LOAD spatial;
          CREATE TABLE combined AS SELECT * FROM read_parquet('temp_parquet/*.parquet');
          CREATE TABLE ccs AS SELECT DISTINCT country_code AS cc FROM combined ORDER BY cc;
          COPY (SELECT cc FROM ccs) TO '/tmp/country_codes_$(CONTINENT).csv' (HEADER false);
          "
          while IFS= read -r cc; do
            [ -n "$cc" ] || continue
            out="parquet/admin-polygons-${cc}.parquet"
            echo "Writing $out ..."
            duckdb -c "
            LOAD spatial;
            CREATE TABLE combined AS SELECT * FROM read_parquet('temp_parquet/*.parquet');
            COPY (
              SELECT * FROM combined WHERE country_code = '${cc}'
              ORDER BY admin_level, bbox_miny, bbox_minx
            ) TO '${out}' (FORMAT PARQUET, COMPRESSION ZSTD, ROW_GROUP_SIZE 5000);
            "
          done < /tmp/country_codes_$(CONTINENT).csv
          rm -rf temp_parquet

          # per-country places parquets
          HAS_PLACES=false
          PLACES_TEMP_COUNT=$(find temp_places_parquet -name "*.parquet" 2>/dev/null | wc -l)
          if [ "$PLACES_TEMP_COUNT" -gt 0 ]; then
            duckdb -c "
            LOAD spatial;
            CREATE TABLE pcombined AS SELECT * FROM read_parquet('temp_places_parquet/*.parquet');
            COPY (SELECT DISTINCT country_code AS cc FROM pcombined ORDER BY cc) TO '/tmp/places_ccs_$(CONTINENT).csv' (HEADER false);
            "
            while IFS= read -r cc; do
              [ -n "$cc" ] || continue
              pout="parquet/osm-places-${cc}.parquet"
              echo "Writing $pout ..."
              duckdb -c "
              LOAD spatial;
              CREATE TABLE pcombined AS SELECT * FROM read_parquet('temp_places_parquet/*.parquet');
              COPY (
                SELECT * FROM pcombined WHERE country_code = '${cc}'
                ORDER BY place_type, lat, lon
              ) TO '${pout}' (FORMAT PARQUET, COMPRESSION ZSTD, ROW_GROUP_SIZE 5000);
              "
              HAS_PLACES=true
            done < /tmp/places_ccs_$(CONTINENT).csv
            rm -rf temp_places_parquet
          fi

          echo "##vso[task.setvariable variable=HAS_PLACES_PARQUET]$HAS_PLACES"
          echo "=== Per-country GeoParquet files produced ==="
          ls -lh parquet/

    - task: PublishPipelineArtifact@1
      displayName: 'Store per-country GeoParquet artifacts'
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/parquet'
        artifact: 'admin-polygons-parquet-$(CONTINENT)'
        publishLocation: 'pipeline'

    - task: PublishPipelineArtifact@1
      displayName: 'Store per-country OSM places GeoParquet artifacts'
      condition: and(succeeded(), eq(variables['HAS_PLACES_PARQUET'], 'true'))
      continueOnError: true
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/parquet'
        artifact: 'osm-places-parquet-$(CONTINENT)'
        publishLocation: 'pipeline'

    - task: Bash@3
      displayName: 'Cleanup workspace'
      condition: always()
      inputs:
        targetType: 'inline'
        script: |
          rm -rf $(System.DefaultWorkingDirectory)/*

  # Aggregates validation artifacts and export metadata AFTER the per-country
  # parquet matrix completes. Runs on a host pool (no heavy container needed).
  - job: package
    displayName: 'Bundle validation artifacts & export metadata'
    dependsOn: parquet
    timeoutInMinutes: 120
    workspace:
      clean: all
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - task: DownloadPipelineArtifact@2
      enabled: true
      displayName: 'Download all per-country parquet artifacts for duplicate check'
      inputs:
        buildType: 'current'
        itemPattern: 'admin-polygons-parquet-*/**'
        targetPath: '$(System.DefaultWorkingDirectory)/parquet-check'

    - task: Bash@3
      enabled: true
      displayName: 'Verify no duplicate country_code parquet files across continents'
      inputs:
        targetType: 'inline'
        script: |
          set -e
          echo "=== Checking for duplicate per-country parquet files ==="
          DUPLICATES=$(find parquet-check -name "admin-polygons-*.parquet" -exec basename {} \; | sort | uniq -d)
          if [ -n "$DUPLICATES" ]; then
            echo "ERROR: Duplicate per-country parquet files found across continents:"
            echo "$DUPLICATES"
            echo ""
            echo "Each country_code must produce exactly one parquet file."
            echo "Cause: a feature's country_code was derived to a value that conflicts"
            echo "with another continent's parquet (e.g. FR from australia-oceania vs europe)."
            echo "Fix: add a CC remap in scripts/convert_to_parquet.sh for the affected extract."
            exit 1
          fi
          echo "OK: No duplicate parquet files found."
          find parquet-check -name "admin-polygons-*.parquet" -exec basename {} \; | sort | head -20
          echo "... ($(find parquet-check -name 'admin-polygons-*.parquet' | wc -l) total files)"

    - task: Bash@3
      enabled: true
      displayName: 'Verify admin_level=2 polygon exists per country'
      continueOnError: true
      inputs:
        targetType: 'inline'
        script: |
          set +e
          echo "=== Checking admin_level=2 coverage per country ==="
          MISSING_L2=""
          TOTAL=0
          for pq in parquet-check/admin-polygons-*.parquet; do
            [ -f "$pq" ] || continue
            CC=$(basename "$pq" .parquet | sed 's/^admin-polygons-//')
            TOTAL=$((TOTAL + 1))
            HAS_L2=$(duckdb -c "
              INSTALL spatial; LOAD spatial;
              SELECT count(*) FROM read_parquet('${pq}')
              WHERE admin_level = 2
            " 2>/dev/null | tail -1)
            if [ "${HAS_L2:-0}" -eq 0 ]; then
              MISSING_L2="${MISSING_L2}  ${CC}\n"
            fi
          done
          echo "Checked $TOTAL country parquets."
          if [ -n "$MISSING_L2" ]; then
            echo ""
            echo "WARNING: The following countries have NO admin_level=2 polygon:"
            echo -e "$MISSING_L2"
            echo "This may indicate a missing Overture fallback, a broken OSM relation,"
            echo "or a country_code derivation error. Investigate before release."
          else
            echo "OK: All countries have at least one admin_level=2 polygon."
          fi

    - task: DownloadPipelineArtifact@2
      enabled: true
      displayName: 'Download all validation artifacts'
      continueOnError: true
      inputs:
        buildType: 'current'
        buildVersionToDownload: 'latest'
        itemPattern: 'validation-*/**'
        targetPath: '$(System.DefaultWorkingDirectory)/validation-artifacts'

    - task: Bash@3
      enabled: true
      displayName: 'Bundle validation artifacts & generate export metadata'
      inputs:
        targetType: 'inline'
        script: |
          set -e

          # Collect all validation.json files into a single directory and archive
          mkdir -p validation
          if [ -d "validation-artifacts" ]; then
            for vdir in validation-artifacts/validation-*/; do
              if [ -f "${vdir}validation.json" ]; then
                ARTIFACT_NAME=$(basename "$vdir")
                cp "${vdir}validation.json" "validation/${ARTIFACT_NAME}-validation.json" || true
              fi
            done
          fi
          VALIDATION_COUNT=$(find validation -name "*.json" 2>/dev/null | wc -l)
          echo "Collected $VALIDATION_COUNT validation file(s)"
          if [ "$VALIDATION_COUNT" -gt 0 ]; then
            tar cfz validation.tar.gz validation/
            python3 scripts/generate_validation_summary.py validation/ || true
            echo "##vso[task.setvariable variable=HAS_VALIDATION]true"
          else
            echo "##vso[task.setvariable variable=HAS_VALIDATION]false"
          fi

          # Extract and parse export metadata
          EXPORTED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          EXPORT_COMMIT="$(Build.SourceVersion)"
          EXPORT_BUILD_ID="$(Build.BuildId)"
          EXPORT_BUILD_NUM="$(Build.BuildNumber)"

          REUSED_EXPORT=false
          if [ "${{ parameters.reuseExportArtifacts }}" = "true" ] || [ "${{ parameters.reuseExportArtifacts }}" = "True" ]; then
            REUSED_EXPORT=true
          fi

          # Generate export-info.json metadata artifact
          cat <<EOF > export-info.json
          {
            "exported_at": "$EXPORTED_AT",
            "export_pipeline_commit": "$EXPORT_COMMIT",
            "export_build_id": "$EXPORT_BUILD_ID",
            "export_build_number": "$EXPORT_BUILD_NUM",
            "release_pipeline_commit": "$(Build.SourceVersion)",
            "release_build_id": "$(Build.BuildId)",
            "release_build_number": "$(Build.BuildNumber)",
            "reused_export_artifacts": $REUSED_EXPORT
          }
          EOF
          cat export-info.json

    - task: PublishPipelineArtifact@1
      enabled: true
      displayName: 'Store validation archive artifact'
      condition: and(succeeded(), eq(variables['HAS_VALIDATION'], 'true'))
      continueOnError: true
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/validation.tar.gz'
        artifact: 'admin-polygons-validation'
        publishLocation: 'pipeline'

    - task: PublishPipelineArtifact@1
      enabled: true
      displayName: 'Store validation summary artifact'
      condition: and(succeeded(), eq(variables['HAS_VALIDATION'], 'true'))
      continueOnError: true
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/validation/validation-summary.md'
        artifact: 'validation-summary'
        publishLocation: 'pipeline'

    - task: PublishPipelineArtifact@1
      enabled: true
      displayName: 'Store export metadata artifact'
      condition: succeeded()
      continueOnError: true
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/export-info.json'
        artifact: 'export-info'
        publishLocation: 'pipeline'

    - task: Bash@3
      displayName: 'Cleanup workspace'
      condition: always()
      inputs:
        targetType: 'inline'
        script: |
          rm -rf $(System.DefaultWorkingDirectory)/*
