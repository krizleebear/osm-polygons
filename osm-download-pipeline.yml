# OSM PBF data download pipeline
# Downloads Geofabrik OSM extracts and caches them as Azure Pipeline artifacts
# for consumption by the polygon-export-pipeline.yml.
#
# Regions are grouped by Geofabrik continent path for readability.
# Continent assignments in the political sense are defined in scripts/countries.json.

name: osm-download

trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

jobs:
- job: download
  timeoutInMinutes: 120
