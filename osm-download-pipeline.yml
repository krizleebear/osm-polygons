  steps:
  - task: Bash@3
    displayName: 'Download PBF from Geofabrik'
    inputs:
      targetType: 'inline'
      script: |
        set -euo pipefail
        # Random jitter at startup (0 to 20s) to desynchronize matrix jobs hitting Geofabrik at once
        JITTER=$((RANDOM % 21))
        echo "Applying initial jitter delay of ${JITTER}s for $(OSM_REGION)..."
        sleep "$JITTER"


        echo "Downloading $(OSM_REGION) from $(PBF_URL) ..."
        
        # Robust download with exponential backoff + randomized jitter
        SUCCESS=false
        for ATTEMPT in 1 2 3 4 5; do
          # Start curl in background and monitor progress cleanly every 15 seconds
          curl --fail --location \
               --continue-at - \
               --silent --show-error \
               --speed-limit 10240 --speed-time 30 \
               --retry 2 --retry-delay 5 --retry-all-errors \
               --output "$(OSM_REGION).osm.pbf" \
               "$(PBF_URL)" &
          CURL_PID=$!

          # Monitor loop: print human-readable size every 15s
          while kill -0 "$CURL_PID" 2>/dev/null; do
            sleep 15
            if [ -f "$(OSM_REGION).osm.pbf" ]; then
              SIZE=$(du -h "$(OSM_REGION).osm.pbf" | cut -f1)
              echo "[$(OSM_REGION)] Download in progress... current size: $SIZE"
            fi
          done

          if wait "$CURL_PID"; then
            SUCCESS=true
            break




          else
            if [ "$ATTEMPT" -lt 5 ]; then
              WAIT_TIME=$(( ATTEMPT * 10 + (RANDOM % 15) ))
              echo "Download attempt $ATTEMPT failed for $(OSM_REGION). Retrying in ${WAIT_TIME}s (attempt $((ATTEMPT + 1))/5)..."
              sleep "$WAIT_TIME"
            fi
          fi
        done

        if [ "$SUCCESS" != "true" ]; then
          echo "ERROR: Failed to download $(OSM_REGION) from $(PBF_URL) after 5 attempts."
          exit 1
        fi

        echo "Download complete: $(du -h "$(OSM_REGION).osm.pbf" | cut -f1)"


  - task: PublishPipelineArtifact@1
    enabled: true
    displayName: 'Cache PBF artifact'
    inputs:
      targetPath: '$(OSM_REGION).osm.pbf'
      artifact: 'osm-data-$(OSM_REGION)'
      publishLocation: 'pipeline'

  - task: Bash@3
    displayName: 'Cleanup downloaded PBF from runner disk'
    condition: always()
    inputs:
      targetType: 'inline'
      script: |
        rm -f "$(OSM_REGION).osm.pbf"

- job: reference_polygons
  displayName: 'Pre-fetch intact reference polygons from Postpass'
  timeoutInMinutes: 15
  steps:
  - task: DownloadPipelineArtifact@2
    displayName: 'Download previous reference polygons cache (fallback)'
    continueOnError: true
    inputs:
      buildType: 'specific'
      project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
      definition: '9'
      buildVersionToDownload: 'latest'
      allowFailedBuilds: true
      allowPartiallySucceededBuilds: true
      itemPattern: 'admin-polygons-reference/**'
      targetPath: '$(System.DefaultWorkingDirectory)/cached-reference'

  - task: Bash@3
    displayName: 'Fetch reference polygons from Postpass API'
    inputs:
      targetType: 'inline'
      script: |
        set -euo pipefail
        CACHED_REF=$(find cached-reference -name "reference-polygons.geojsonseq" 2>/dev/null | head -n 1 || true)
        FALLBACK_ARG=""
        if [ -n "$CACHED_REF" ] && [ -s "$CACHED_REF" ]; then
          echo "[INFO] Found cached reference polygons fallback: ${CACHED_REF}"
          FALLBACK_ARG="--fallback-reference ${CACHED_REF}"
        else
          echo "[INFO] No previous cached reference polygons found; running without cache fallback."
        fi
        python3 scripts/fetch_postpass_polygons.py \
          --candidates scripts/postpass-candidates.json \
          --out-dir reference-polygons \
          ${FALLBACK_ARG}
        ls -la reference-polygons

  - task: PublishPipelineArtifact@1
    enabled: true
    displayName: 'Cache reference polygons artifact'
    inputs:
      targetPath: 'reference-polygons'
      artifact: 'admin-polygons-reference'
      publishLocation: 'pipeline'

