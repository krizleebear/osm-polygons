# OSM Polygon Manual GitHub Release Pipeline
# Downloads latest build artifacts, packages global + continent + individual country files, and creates GitHub Release.
name: polygon-release-pipeline

trigger: none # Never runs automatically

pool:
  vmImage: 'ubuntu-latest'

jobs:
- job: release
  displayName: 'Publish GitHub Release'
  timeoutInMinutes: 360
  steps:
  - checkout: self

  # Download latest global & continent artifacts from build definition '4' (krizleebear.osm-polygons)
  - task: DownloadPipelineArtifact@2
    displayName: 'Download latest build artifacts'
    inputs:
      buildType: 'specific'
      project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
      definition: '4'
      buildVersionToDownload: 'latest'
      targetPath: '$(System.DefaultWorkingDirectory)/downloads'

  - task: Bash@3
    displayName: 'Prepare Release Assets & Traceability Metadata'
    inputs:
      targetType: 'inline'
      script: |
        set -x
        mkdir -p release-assets

        # 1. Global combined archive
        find downloads -name "simplified.tar.gz" -exec cp {} release-assets/simplified-all.tar.gz \;

        # 2. Continental archives
        find downloads -name "simplified-*.tar.gz" -exec cp {} release-assets/ \;

        # 3. Individual country .geojsonseq files & build-info.json
        find downloads -name "simplified-*.tar.gz" | while read -r archive; do
          tar xfz "$archive" -C release-assets/
        done
        if [ -d "release-assets/simplified" ]; then
          mv release-assets/simplified/*.geojsonseq release-assets/ 2>/dev/null || true
          mv release-assets/simplified/build-info.json release-assets/ 2>/dev/null || true
          rmdir release-assets/simplified 2>/dev/null || true
        fi

        # Generate Traceability Release Notes
        BUILD_TIME=$(jq -r '.osm_data_extracted_at // "N/A"' release-assets/build-info.json 2>/dev/null || echo "N/A")
        OSMIUM_IMG=$(jq -r '.osmium_tool_image // "v1.18.0"' release-assets/build-info.json 2>/dev/null || echo "v1.18.0")
        TOOLS_IMG=$(jq -r '.osm_tools_image // "latest"' release-assets/build-info.json 2>/dev/null || echo "latest")
        COMMIT_SHA=$(jq -r '.pipeline_commit // "'$(Build.SourceVersion)'"' release-assets/build-info.json 2>/dev/null || echo "$(Build.SourceVersion)")
        BUILD_NUM=$(jq -r '.pipeline_build_number // "'$(Build.BuildNumber)'"' release-assets/build-info.json 2>/dev/null || echo "$(Build.BuildNumber)")

        cat <<EOF > release-notes.md
        ## 🔍 Traceability & Versioning Info

        | Component | Version / Identifier | Details |
        | :--- | :--- | :--- |
        | **OSM Data Snapshot** | \`${BUILD_TIME}\` | Extracted from Geofabrik PBF sources |
        | **\`osmium-tool\` Image** | \`${OSMIUM_IMG}\` | PBF filtering & GeoJSON sequence export |
        | **\`osm-tools\` Image** | \`${TOOLS_IMG}\` | Polygon coverage simplification engine |
        | **Pipeline Build** | Build \`${BUILD_NUM}\` | Commit [\`${COMMIT_SHA}\`](https://github.com/\$(Build.Repository.Name)/commit/\${COMMIT_SHA}) |

        ### 📦 Release Assets
        - **\`simplified-all.tar.gz\`**: Global combined archive containing all simplified administrative boundaries worldwide.
        - **\`simplified-<continent>.tar.gz\`**: Continental archives (Africa, Asia, Europe, Oceania, Central America).
        - **\`*.geojsonseq\`**: Individual per-country polygon stream files for targeted single-country downloads.
        EOF


        ls -la release-assets/
        cat release-notes.md

  - task: GitHubRelease@1
    displayName: 'Create GitHub Release'
    inputs:
      gitHubConnection: '3c34db30-d57b-42e2-a970-857bd932c6c0'
      repositoryName: '$(Build.Repository.Name)'
      action: 'create'
      target: '$(Build.SourceVersion)'
      tagSource: 'userSpecifiedTag'
      tag: 'v1.6-alpha'
      title: 'OSM Admin Polygons Release'
      releaseNotesSource: 'filePath'
      releaseNotesFilePath: '$(System.DefaultWorkingDirectory)/release-notes.md'
      assets: |
        $(System.DefaultWorkingDirectory)/release-assets/*.tar.gz
        $(System.DefaultWorkingDirectory)/release-assets/*.geojsonseq
      assetUploadMode: 'delete'
      isDraft: true
      isPreRelease: true

