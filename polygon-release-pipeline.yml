# OSM Polygon Manual GitHub Release Pipeline
# Downloads latest build artifacts, packages per-country GeoParquet files, generates index.json, and creates GitHub Release.
name: polygon-release-pipeline

trigger: none # Never runs automatically

parameters:
- name: releaseTag
  displayName: 'GitHub Release Tag (e.g. v2.4.0)'
  type: string
  default: 'v2.4.0'
- name: releaseTitle
  displayName: 'GitHub Release Title'
  type: string
  default: 'OSM Administrative Polygons GeoParquet Release v2.4.0'
- name: specificBuildId
  displayName: 'Build ID from export pipeline (use "latest" or "auto" for newest build)'
  type: string
  default: 'latest'
- name: isDraft
  displayName: 'Create as Draft Release'
  type: boolean
  default: false
- name: isPreRelease
  displayName: 'Mark as Pre-release'
  type: boolean
  default: false

pool:
  vmImage: 'ubuntu-latest'

jobs:
- job: release
  displayName: 'Publish GitHub Release'
  timeoutInMinutes: 360
  steps:
  - checkout: self

  # Download latest GeoParquet build artifacts from build definition '4' (krizleebear.osm-polygons)
  - task: DownloadPipelineArtifact@2
    displayName: 'Download latest per-country GeoParquet build artifacts'
    inputs:
      buildType: 'specific'
      project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
      definition: '4'
      ${{ if and(ne(parameters.specificBuildId, 'latest'), ne(parameters.specificBuildId, 'auto'), ne(parameters.specificBuildId, '')) }}:
        buildVersionToDownload: 'specific'
        pipelineId: '${{ parameters.specificBuildId }}'
      ${{ if or(eq(parameters.specificBuildId, 'latest'), eq(parameters.specificBuildId, 'auto'), eq(parameters.specificBuildId, '')) }}:
        buildVersionToDownload: 'latest'
      itemPattern: |
        parquet*/**
        validation-summary/**
        admin-polygons-validation/**
      targetPath: '$(System.DefaultWorkingDirectory)/downloads'

  - task: Bash@3
    displayName: 'Prepare Release Assets, index.json & Traceability Metadata'
    inputs:
      targetType: 'inline'
      script: |
        set -e
        mkdir -p release-assets

        # 1. Per-country Administrative GeoParquet files
        find downloads -name "admin-polygons-*.parquet" -exec cp {} release-assets/ \;

        # 2. Per-country OSM Place-Nodes GeoParquet files
        find downloads -name "osm-places-*.parquet" -exec cp {} release-assets/ \;

        # 3. Validation Summary & Archive
        if [ -d "downloads/validation-summary" ]; then
          find downloads/validation-summary -name "validation-summary.md" -exec cp {} release-assets/ \;
        fi
        if [ -d "downloads/admin-polygons-validation" ]; then
          find downloads/admin-polygons-validation -name "validation.tar.gz" -exec cp {} release-assets/ \;
        fi

        # Reclaim runner disk space immediately by removing downloaded temp folders
        rm -rf downloads

        PARQUET_COUNT=$(find release-assets -name "admin-polygons-*.parquet" | wc -l)
        if [ "$PARQUET_COUNT" -eq 0 ]; then
          echo "****************************************************************"
          echo " ERROR: No per-country GeoParquet (.parquet) files found in downloads!"
          echo ""
          echo " Cause:"
          echo " The latest build run of the export pipeline (definition 4) failed"
          echo " or did not publish its per-country GeoParquet artifacts."
          echo ""
          echo " Solution:"
          echo " Please run and verify that 'polygon-export-pipeline.yml' completes"
          echo " successfully before triggering this GitHub release pipeline."
          echo "****************************************************************"
          exit 1
        fi

        echo "[INFO] Found $PARQUET_COUNT per-country GeoParquet file(s) for release."
        ls -lh release-assets/

        # 4. Generate index.json from SSOT (scripts/countries.json)
        python3 - <<'PYEOF'
        import json, os, datetime

        release_tag = os.environ.get('RELEASE_TAG', '${{ parameters.releaseTag }}')
        base_url = f"https://github.com/krizleebear/osm-polygons/releases/download/{release_tag}/"
        file_pattern = "admin-polygons-{cc}.parquet"

        with open('scripts/countries.json') as f:
            countries_meta = json.load(f)

        # Only include countries that actually have a parquet file in this release
        available = set()
        for fname in os.listdir('release-assets'):
            if fname.startswith('admin-polygons-') and fname.endswith('.parquet'):
                cc = fname[len('admin-polygons-'):-len('.parquet')]
                available.add(cc)

        countries_list = []
        for cc, meta in sorted(countries_meta.items()):
            if cc in available:
                countries_list.append({
                    "cc": cc,
                    "continent": meta["continent"],
                    "name": meta["name"]
                })

        index = {
            "version": release_tag.lstrip('v'),
            "generated_at": datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
            "base_url": base_url,
            "file_pattern": file_pattern,
            "countries": countries_list
        }

        with open('release-assets/index.json', 'w') as f:
            json.dump(index, f, indent=2, ensure_ascii=False)

        print(f"[INFO] index.json generated with {len(countries_list)} countries.")
        PYEOF

        # 5. Generate Release Notes Markdown
        cat <<EOF > release-notes.md
        ## OSM Administrative Polygons GeoParquet Release (${{ parameters.releaseTag }})

        Per-country OGC GeoParquet 1.1 datasets containing unsimplified, topologically consistent administrative boundary polygons and companion place nodes extracted directly from OpenStreetMap.

        ### Key Highlights
        - **Per-country files:** One \`admin-polygons-{CC}.parquet\` per country — no more 2 GiB continental aggregates.
        - **\`index.json\` catalog:** Machine-readable country list with continent assignment, \`base_url\`, and \`file_pattern\` — DuckDB globbing workaround for HTTP range queries.
        - **100% Topologically Consistent (0% Border-Bleeding):** Exact boundaries without simplification artifacts.
        - **OGC GeoParquet 1.1 Specification:** Native WGS84 (\`OGC:CRS84\`) geometry with ZSTD compression and spatial bounding-box indexing.
        - **OSM Place-Nodes Companion Dataset (\`osm-places-{CC}.parquet\`):** Full coverage of point features for villages, hamlets, quarters, and suburbs.
        - **Sub-Second SQL Queries via HTTP Range Requests:** Direct selective querying with DuckDB without downloading the entire dataset.

        ### Querying Multiple Countries with DuckDB

        \`\`\`python
        import duckdb, json, urllib.request

        BASE = "https://github.com/krizleebear/osm-polygons/releases/download/${{ parameters.releaseTag }}/"
        idx = json.load(urllib.request.urlopen(BASE + "index.json"))

        # Select all European countries
        ccs  = [c["cc"] for c in idx["countries"] if c["continent"] == "europe"]
        urls = [idx["base_url"] + idx["file_pattern"].replace("{cc}", cc) for cc in ccs]

        # Point-in-Polygon query for Munich across all European countries
        result = duckdb.sql(f"""
            INSTALL spatial; LOAD spatial;
            SELECT admin_level, name, wikidata, iso3166_2
            FROM read_parquet({urls})
            WHERE bbox_minx <= 11.5761 AND bbox_maxx >= 11.5761
              AND bbox_miny <= 48.1371 AND bbox_maxy >= 48.1371
              AND ST_Contains(geom, ST_Point(11.5761, 48.1371))
            ORDER BY admin_level
        """)
        \`\`\`

        ### Dataset Schema & Attributes
        | Column | Type | Nullable | Description |
        | :--- | :--- | :---: | :--- |
        | **\`continent\`** | \`VARCHAR\` | No | Continental region (\`europe\`, \`asia\`, \`north-america\`, \`us\`, \`russia\`, etc.) |
        | **\`country_code\`** | \`VARCHAR\` | No | ISO 3166-1 alpha-2 country code derived from feature tags (\`DE\`, \`FR\`, \`GB\`, etc.) |
        | **\`admin_level\`** | \`TINYINT\` | No | OSM administrative level (\`2\` to \`11\`) |
        | **\`area_type\`** | \`VARCHAR\` | No | Semantic area type (\`municipality\`, \`suburb\`, \`quarter\`, \`hamlet\`, etc.) |
        | **\`boundary\`** | \`VARCHAR\` | No | Boundary classification (\`administrative\`, \`traditional\`, \`statistical\`, \`cadastral\`, \`local_authority\`) |
        | **\`osm_id\`** | \`BIGINT\` | No | OSM relation/way numeric identifier |
        | **\`name\`** | \`VARCHAR\` | No | Primary localized name |
        | **\`name_en\`** | \`VARCHAR\` | Yes | English name (\`name:en\`) |
        | **\`wikidata\`** | \`VARCHAR\` | Yes | Wikidata entity identifier (e.g. \`Q64\` for Berlin) |
        | **\`iso3166_1\`** | \`VARCHAR\` | Yes | Country ISO code (\`admin_level=2\`) |
        | **\`iso3166_2\`** | \`VARCHAR\` | Yes | Regional / State ISO code (e.g. \`DE-BY\`, \`US-NY\`) |
        | **\`parent_osm_id\`** | \`BIGINT\` | Yes | Direct parent administrative entity ID |
        | **\`parent_iso3166_2\`**| \`VARCHAR\` | Yes | Parent regional/state ISO code |
        | **\`parent_name\`** | \`VARCHAR\` | Yes | Primary name of direct parent entity |
        | **\`postal_code\`** | \`VARCHAR\` | Yes | Postal / ZIP code |
        | **\`ref\`** | \`VARCHAR\` | Yes | Official statistical municipality key (\`AGS\`, \`INSEE\`) |
        | **\`bbox_minx\` / \`miny\` / \`maxx\` / \`maxy\`** | \`DOUBLE\` | No | Bounding box coordinates |
        | **\`tags\`** | \`JSON\` | Yes | Complete raw OSM tag dictionary |
        | **\`geom\`** | \`GEOMETRY\` | No | Valid OGC Polygon / MultiPolygon (WGS84) |

        ### Continent Assignments
        Continent assignments follow political reality, not Geofabrik server paths. Notable cases:
        - **\`ES\`** (Spain): includes Canary Islands (Geofabrik: \`africa/\`) — all under \`europe\`.
        - **\`TR\`** (Turkey): assigned to \`europe\`.
        - **\`GP\`/\`MQ\`/\`GF\`/\`RE\`/\`YT\`** (French overseas territories): assigned to \`europe\` as EU outermost regions.
        - **\`GB\`** (United Kingdom): includes Northern Ireland (correct \`country_code\` derivation from \`iso3166_2\` prefix).
        - Multi-country Geofabrik extracts (e.g. \`gcc-states\`, \`malaysia-singapore-brunei\`) are fully split into individual country files.

        See \`index.json\` for the complete country list and continent assignments.

        ---
        ### Data Source & License
        This dataset is derived from [OpenStreetMap](https://www.openstreetmap.org/) data and is made available under the [Open Database License (ODbL)](https://opendatacommons.org/licenses/odbl/1.0/).
        © OpenStreetMap contributors — https://www.openstreetmap.org/copyright

        *Built with DuckDB spatial extension and ZSTD compression.*
        EOF

        ls -la release-assets/
        cat release-notes.md

  - task: GitHubRelease@1
    displayName: 'Create GitHub Release'
    inputs:
      gitHubConnection: '3c34db30-d57b-42e2-a970-857bd932c6c0'
      repositoryName: '$(Build.Repository.Name)'
      action: 'create'
      target: '$(Build.SourceVersion)'
      tagSource: 'userSpecifiedTag'
      tag: '${{ parameters.releaseTag }}'
      title: '${{ parameters.releaseTitle }}'
      releaseNotesSource: 'filePath'
      releaseNotesFilePath: '$(System.DefaultWorkingDirectory)/release-notes.md'
      assets: |
        $(System.DefaultWorkingDirectory)/release-assets/*.parquet
        $(System.DefaultWorkingDirectory)/release-assets/index.json
        $(System.DefaultWorkingDirectory)/release-assets/validation-summary.md
        $(System.DefaultWorkingDirectory)/release-assets/validation.tar.gz
      assetUploadMode: 'delete'
      isDraft: ${{ parameters.isDraft }}
      isPreRelease: ${{ parameters.isPreRelease }}
