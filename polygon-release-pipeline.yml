# OSM Polygon Manual GitHub Release Pipeline
# Downloads latest build artifacts, packages global + continent + individual country files, and creates GitHub Release.
name: polygon-release-pipeline

trigger: none # Never runs automatically

pool:
  vmImage: 'ubuntu-latest'

jobs:
- job: release
  displayName: 'Publish GitHub Release'
  timeoutInMinutes: 360
  steps:
  - checkout: self

  # Download latest simplified global & continent artifacts from build definition '4' (krizleebear.osm-polygons)
  - task: DownloadPipelineArtifact@2
    displayName: 'Download latest build artifacts'
    inputs:
      buildType: 'specific'
      project: 'f85b0393-1484-487a-b6d1-5120b54a70be'
      definition: '4'
      buildVersionToDownload: 'latest'
      itemPattern: 'admin-polygons-simplified*/**'
      targetPath: '$(System.DefaultWorkingDirectory)/downloads'

  - task: Bash@3
    displayName: 'Prepare Release Assets & Traceability Metadata'
    inputs:
      targetType: 'inline'
      script: |
        set -e
        mkdir -p release-assets

        # 1. Global combined archive
        find downloads -name "simplified.tar.gz" -exec cp {} release-assets/simplified-all.tar.gz \;

        # 2. Continental archives
        find downloads -name "simplified-*.tar.gz" -exec cp {} release-assets/ \;

        # Check if artifacts were found
        if [ ! -f "release-assets/simplified-all.tar.gz" ]; then
          echo "****************************************************************"
          echo " ERROR: No simplified polygon artifacts found in build downloads!"
          echo ""
          echo " Cause:"
          echo " The latest build run of the export pipeline (definition 4) failed"
          echo " or did not publish its final 'package' stage artifacts."
          echo ""
          echo " Solution:"
          echo " Please run and verify that 'polygon-export-pipeline.yml' completes"
          echo " successfully before triggering this GitHub release pipeline."
          echo "****************************************************************"
          exit 1
        fi

        # 3. Extract build-info.json, VERSION.txt, and individual country .geojsonseq files from the global archive
        tar xfz release-assets/simplified-all.tar.gz -C release-assets/
        if [ -d "release-assets/simplified" ]; then
          mv release-assets/simplified/*.geojsonseq release-assets/ 2>/dev/null || true
          mv release-assets/simplified/build-info.json release-assets/ 2>/dev/null || true
          mv release-assets/simplified/VERSION.txt release-assets/ 2>/dev/null || true
          rm release-assets/simplified/osm-tools-version.info 2>/dev/null || true
          rmdir release-assets/simplified 2>/dev/null || true
        fi

        # Reclaim runner disk space immediately by removing downloaded archives
        rm -rf downloads

        GEOJSON_COUNT=$(find release-assets -name "*.geojsonseq" | wc -l)
        if [ "$GEOJSON_COUNT" -eq 0 ]; then
          echo "****************************************************************"
          echo " ERROR: No polygon stream files (.geojsonseq) were found in downloaded artifacts!"
          echo ""
          echo " Cause:"
          echo " The build artifacts downloaded from pipeline definition 4 are empty."
          echo ""
          echo " Solution:"
          echo " Re-run 'polygon-export-pipeline.yml' and ensure it generates valid"
          echo " simplified polygon files before triggering this release."
          echo "****************************************************************"
          exit 1
        fi

        # Generate Traceability Release Notes & osm-tools Changelog
        BUILD_TIME=$(jq -r '.osm_data_extracted_at // "N/A"' release-assets/build-info.json 2>/dev/null || echo "N/A")
        OSMIUM_IMG=$(jq -r '.osmium_tool_image // "v1.19.0"' release-assets/build-info.json 2>/dev/null || echo "v1.19.0")
        TOOLS_COMMIT=$(jq -r '.osm_tools_commit // ""' release-assets/build-info.json 2>/dev/null || echo "")
        REUSED_EXPORT=$(jq -r '.reused_export_artifacts // false' release-assets/build-info.json 2>/dev/null || echo "false")
        EXPORT_COMMIT=$(jq -r '.export_pipeline_commit // ""' release-assets/build-info.json 2>/dev/null || echo "")
        EXPORT_BUILD_NUM=$(jq -r '.export_build_number // ""' release-assets/build-info.json 2>/dev/null || echo "")
        SIMP_COMMIT=$(jq -r '.simplification_pipeline_commit // ""' release-assets/build-info.json 2>/dev/null || echo "")
        
        # Fallback if TOOLS_COMMIT is empty or N/A
        if [ -z "$TOOLS_COMMIT" ] || [ "$TOOLS_COMMIT" = "N/A" ] || [ "$TOOLS_COMMIT" = "latest" ]; then
          TOOLS_COMMIT="ce8f90b7cff39a2b6863b296ec718db1c52288fa"
        fi

        SHORT_TOOLS_SHA=${TOOLS_COMMIT:0:8}
        SHORT_EXPORT_SHA=${EXPORT_COMMIT:0:8}
        SHORT_SIMP_SHA=${SIMP_COMMIT:0:8}

        EXPORT_DETAILS="Direct Build ${EXPORT_BUILD_NUM}"
        if [ "$REUSED_EXPORT" = "true" ] || [ "$REUSED_EXPORT" = "True" ]; then
          EXPORT_DETAILS="Reused from Build ${EXPORT_BUILD_NUM}"
        fi

        # Query previous GitHub release to find previous osm-tools commit for comparison link
        PREV_RELEASE_BODY=$(curl -s "https://api.github.com/repos/krizleebear/osm-polygons/releases" | jq -r '.[0].body // ""' 2>/dev/null || echo "")
        PREV_TOOLS_COMMIT=$(echo "$PREV_RELEASE_BODY" | grep -oE 'github.com/krizleebear/osm-tools/(commit|compare)/([a-f0-9]+)' | head -n 1 | sed -E 's/.*(commit|compare)\/([a-f0-9]+)/\2/' || echo "")

        if [ -n "$PREV_TOOLS_COMMIT" ] && [ "$PREV_TOOLS_COMMIT" != "$TOOLS_COMMIT" ]; then
          SHORT_PREV_TOOLS_SHA=${PREV_TOOLS_COMMIT:0:8}
          CHANGELOG_SECTION="### \`osm-tools\` Engine Changes"$'\n'"- **Diff:** [\`${SHORT_PREV_TOOLS_SHA}...${SHORT_TOOLS_SHA}\`](https://github.com/krizleebear/osm-tools/compare/${PREV_TOOLS_COMMIT}...${TOOLS_COMMIT})"$'\n'"- **Engine Commit:** [\`${SHORT_TOOLS_SHA}\`](https://github.com/krizleebear/osm-tools/commit/${TOOLS_COMMIT})"
        else
          CHANGELOG_SECTION="### \`osm-tools\` Engine"$'\n'"- **Engine Commit:** [\`${SHORT_TOOLS_SHA}\`](https://github.com/krizleebear/osm-tools/commit/${TOOLS_COMMIT})"
        fi

        cat <<EOF > release-notes.md
        ## Traceability & Component Versions

        | Component | Version / Identifier | Details |
        | :--- | :--- | :--- |
        | **OSM Data Extraction** | \`${BUILD_TIME}\` | Extracted from Geofabrik PBF sources |
        | **Export Pipeline** | [\`${SHORT_EXPORT_SHA}\`](https://github.com/krizleebear/osm-polygons/commit/${EXPORT_COMMIT}) | ${EXPORT_DETAILS} |
        | **Simplification Pipeline** | [\`${SHORT_SIMP_SHA}\`](https://github.com/krizleebear/osm-polygons/commit/${SIMP_COMMIT}) | Polygons build pipeline |
        | **\`osmium-tool\` Image** | \`${OSMIUM_IMG}\` | PBF filtering & GeoJSON sequence export |
        | **\`osm-tools\` Engine** | [\`${SHORT_TOOLS_SHA}\`](https://github.com/krizleebear/osm-tools/commit/${TOOLS_COMMIT}) | Topology-preserving polygon simplification |

        ${CHANGELOG_SECTION}

        ### Release Assets
        - **\`simplified-all.tar.gz\`**: Global combined archive containing all simplified administrative boundaries worldwide.
        - **\`simplified-<continent>.tar.gz\`**: Continental archives (Africa, Asia, Europe, Australia/Oceania, Central America, North America, South America, Russia).
        - **\`*.geojsonseq\`**: Individual per-country polygon stream files for targeted single-country downloads.
        - **\`admin-levels-summary.md\` / \`.csv\` / \`.json\`**: Complete per-country matrix of polygon counts per \`admin_level\`.
        - **\`VERSION.txt\` / \`build-info.json\`**: Release metadata and version traceability.
        EOF

        # Generate Dataset Statistics
        python3 scripts/generate_release_stats.py release-assets release-notes.md

        ls -la release-assets/
        cat release-notes.md


  - task: PublishPipelineArtifact@1
    displayName: 'Store admin-level statistics artifact'
    inputs:
      targetPath: '$(System.DefaultWorkingDirectory)/release-assets/admin-levels-summary.md'
      artifact: 'admin-levels-summary'
      publishLocation: 'pipeline'

  - task: GitHubRelease@1
    displayName: 'Create GitHub Release'
    inputs:
      gitHubConnection: '3c34db30-d57b-42e2-a970-857bd932c6c0'
      repositoryName: '$(Build.Repository.Name)'
      action: 'create'
      target: '$(Build.SourceVersion)'
      tagSource: 'userSpecifiedTag'
      tag: 'v1.6-alpha'
      title: 'OSM Admin Polygons Release'
      releaseNotesSource: 'filePath'
      releaseNotesFilePath: '$(System.DefaultWorkingDirectory)/release-notes.md'
      assets: |
        $(System.DefaultWorkingDirectory)/release-assets/*.tar.gz
        $(System.DefaultWorkingDirectory)/release-assets/*.geojsonseq
        $(System.DefaultWorkingDirectory)/release-assets/admin-levels-summary.*
        $(System.DefaultWorkingDirectory)/release-assets/build-info.json
        $(System.DefaultWorkingDirectory)/release-assets/VERSION.txt
      assetUploadMode: 'delete'
      isDraft: true
      isPreRelease: true



